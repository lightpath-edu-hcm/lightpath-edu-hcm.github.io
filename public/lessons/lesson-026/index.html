:root{--teal:#0d8079;--ink:#164e51;--pale:#e5f7f4;--coral:#fa726a;--gold:#ffcd50}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Georgia,serif;color:var(--ink);background:#e9faf7}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}.app{max-width:1100px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:white;overflow:hidden}.header{height:64px;flex-shrink:0;background:var(--teal);color:white;display:flex;align-items:center;justify-content:space-between;padding:4px 10px;gap:6px}.logo{width:48px;height:48px;object-fit:contain}.title{font-size:clamp(16px,3vw,25px);text-align:center;font-weight:bold}.tools{display:flex;gap:5px;align-items:center}.pill{border:0;border-radius:30px;padding:9px 10px;background:#e3f8f5;color:var(--ink);font:700 15px Arial}.pill.active{background:white}.dots{display:flex;justify-content:center;gap:8px;margin:5px 0;flex-shrink:0}.dot{width:10px;height:10px;border-radius:50%;background:#d4e8e6}.dot.on{background:var(--coral)}.question{text-align:center;background:var(--pale);border-radius:25px;padding:7px 13px;max-width:94%;margin:0 auto 4px;font-size:clamp(15px,2.8vw,22px);font-weight:bold;flex-shrink:0}.main{min-height:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,1.4vh,12px);padding:5px 10px;overflow:hidden}.footer{height:67px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;gap:12px;padding:5px 70px}.action{background:var(--coral);border:2px solid #d94c46;color:white;border-radius:16px;padding:10px 20px;font:700 19px Arial;box-shadow:0 4px 0 #ba4c42}.back{position:absolute;right:12px;bottom:9px;border:0;background:var(--teal);color:white;border-radius:50%;width:46px;height:46px;font-size:25px}.feedback{min-height:22px;text-align:center;font:700 clamp(13px,2.3vw,17px) Arial;color:#a14c29}.tiles,.choices,.groupcards{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(4px,1vw,12px);max-width:100%}.tile{width:var(--tile,55px);height:var(--tile,55px);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;background:#eff9f7;border:2px solid #70b6b0;border-radius:12px;position:relative;touch-action:none}.tile.blank{border:3px dashed #79aeb0;background:white}.tile.selected{outline:4px solid #ffbe43}.tile.grouped{border:3px solid #e6a52f;background:#fff2c9}.tile.grouped.group-start{border-left:6px solid #db8d22;border-radius:12px 3px 3px 12px}.tile.grouped.group-end{border-right:6px solid #db8d22;border-radius:3px 12px 12px 3px}.tile.partial{box-shadow:inset 0 -5px 0 #7eb9ad}.tile.wrong{outline:3px solid #e87169}.sym{width:74%;height:74%;display:block}.sym.A{background:#f5a84d;border:3px solid #9a5d23;border-radius:50%}.sym.B{background:#6eb9df;border:3px solid #39739a;clip-path:polygon(50% 0,100% 100%,0 100%)}.sym.C{background:#9f8ad9;border:3px solid #6952aa;border-radius:9px}.choice{background:white;border:2px solid #6cb4ac;border-radius:15px;padding:7px;min-width:var(--tile,55px);min-height:var(--tile,55px);display:flex;align-items:center;justify-content:center;gap:3px}.choice.active{background:#ffebaf;border-color:#e7a929}.choice .sym{width:calc(var(--tile,55px)*.63);height:calc(var(--tile,55px)*.63)}.groupcards .choice{padding:10px}.label{font:700 14px Arial}.sub{font:700 15px Arial;text-align:center}.board{border:3px solid #72bcb3;background:#effaf8;border-radius:22px;padding:clamp(8px,2vw,18px);max-width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}.hint{border:2px solid #d9a65c;background:#fff5dc;border-radius:14px;padding:8px 12px;font:600 15px Arial;max-width:95%;text-align:center}.hintbtn{background:#fff3d4;border:1px solid #d3a64e;border-radius:12px;padding:6px 10px;font:700 14px Arial}.hero{max-height:min(40vh,270px);max-width:45vw;object-fit:contain}.story{display:flex;align-items:center;justify-content:center;gap:16px;max-width:100%}.path{border:4px solid #d5ad77;border-radius:25px;background:#f7edcf;padding:15px;max-width:100%}.mini{font:700 13px Arial}.segment{display:flex;align-items:center;gap:5px}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tag{border-radius:14px;padding:6px 12px;background:#e5f7f4;font:700 14px Arial}.range{display:flex;align-items:center;gap:4px;max-width:100%}.range .tile{width:var(--tile,55px);height:var(--tile,55px)}.flags .tile{border-radius:3px 3px 15px 15px}.endtext{text-align:center;font-size:clamp(17px,3vw,25px);line-height:1.45}.round{font:700 15px Arial}.legend{font:700 14px Arial;text-align:center}@media(max-width:420px){.header{height:58px}.logo{width:42px;height:42px}.pill{padding:9px}.footer{height:61px}.main{padding:3px 5px}.board{padding:7px}.question{padding:6px 8px}.hero{max-width:35vw}.story{gap:4px}.groupcards .choice{padding:5px}}@media(max-height:680px){.header{height:49px}.logo{width:38px;height:38px}.footer{height:53px}.question{font-size:15px;padding:4px 8px}.main{gap:4px}.hero{max-height:25vh}.board{padding:6px}.action{padding:7px 15px;font-size:16px}}
.school{width:clamp(55px,12vw,105px);height:auto;flex-shrink:0}.board .sub{margin:4px 0}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* S0 visual refresh: school is scenery, pattern objects are raised above the path. */
.story-scene{width:min(100%,900px);height:min(49vh,390px);min-height:205px;position:relative;isolation:isolate;overflow:hidden;border-radius:24px;background:linear-gradient(#b9e9fc 0%,#eafaff 57%,#b9e4a1 58%,#87cb81 100%);border:3px solid #8bcac4}
.school-landscape{position:absolute;inset:0;overflow:hidden;z-index:0}.sun{position:absolute;top:8%;right:13%;width:48px;height:48px;border-radius:50%;background:#ffdb68;box-shadow:0 0 0 12px #ffe9a36e}.cloud{position:absolute;width:94px;height:24px;background:white;border-radius:30px;top:12%;left:12%;box-shadow:20px -12px 0 1px white,43px -4px 0 3px white;opacity:.9}.cloud-two{left:auto;right:23%;top:23%;transform:scale(.65)}
.school-building{position:absolute;width:clamp(135px,31%,265px);height:48%;left:50%;top:18%;transform:translateX(-50%);background:#ffdf9a;border:4px solid #d58c5b;border-radius:5px;box-shadow:0 8px 0 #ba9064}.school-roof{position:absolute;left:-11%;right:-11%;top:-38%;height:43%;background:#df795c;clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 3px 0 #b45b49)}.school-name{position:absolute;top:8%;width:100%;text-align:center;font:bold clamp(11px,2.2vw,19px) Arial;color:#9a493e}.school-windows{position:absolute;top:37%;left:9%;right:9%;display:flex;justify-content:space-between}.school-windows span{width:22%;aspect-ratio:1;background:#94d8f4;border:3px solid #ac7255}.school-door{position:absolute;bottom:0;left:38%;width:24%;height:43%;background:#a66c50;border:3px solid #865038;border-bottom:0;border-radius:10px 10px 0 0}
.walkway{position:absolute;left:13%;right:13%;bottom:-28%;height:76%;background:#e7c99d;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);opacity:.94}.lawn{position:absolute;bottom:0;width:29%;height:28%;border-radius:50%;background:#6bbd69}.lawn-left{left:-10%}.lawn-right{right:-10%}
.scene-bibo{position:absolute;left:2%;bottom:3%;height:65%;max-width:26%;object-fit:contain;z-index:2;filter:drop-shadow(0 5px 3px #537d5960)}
.story-path{position:absolute;left:23%;right:2%;bottom:7%;z-index:3;padding:10px 6px;border-radius:18px;background:#ffffffb8;box-shadow:0 5px 0 #bda7838c;display:flex;justify-content:center}.story-path .tiles{flex-wrap:nowrap;gap:clamp(2px,.8vw,10px)}.story-path .tile{width:min(var(--tile,55px),clamp(29px,7.3vw,66px));height:min(var(--tile,55px),clamp(29px,7.3vw,66px));background:#fff8e9;border-color:#c58b4b;box-shadow:0 5px 0 #9e6d4a,0 7px 9px #56472b55;transform:translateY(-4px)}.story-path .tile.blank{background:#ffffffed;border-style:dashed}.story-path .tile .sym{width:74%;height:74%}
@media(max-width:420px){.story-scene{height:min(43vh,300px);min-height:190px}.scene-bibo{height:58%;left:1%}.story-path{left:18%;right:1%;bottom:5%;padding:8px 3px}.story-path .tile{width:clamp(29px,8.4vw,38px);height:clamp(29px,8.4vw,38px)}.school-building{top:21%;height:42%}}

/* S4: replacement appears inside the original tile, never as a separate ghost */
.tile.replacement-tile{border-color:#e7a431;background:#fff9e8}
.tile.replacement-tile .sym{filter:drop-shadow(0 2px 2px #9d895855)}
.tile.replacement-tile.check-correct{animation:replacementSuccess .95s ease-in-out infinite alternate;border-color:#29b87e;background:#e5fff3}
.tile.replacement-tile.check-wrong{animation:replacementRetry .75s ease-in-out 2 alternate;border-color:#e85d59;background:#fff0ed}
@keyframes replacementSuccess{from{box-shadow:0 0 4px #51d79a}to{box-shadow:0 0 19px 7px #50df9d}}
@keyframes replacementRetry{from{box-shadow:0 0 3px #ed8075}to{box-shadow:0 0 12px 5px #ec7873}}
.tile.s4-target{outline:3px solid #efbb52;outline-offset:2px}
.tile{padding:0}.choice:disabled{opacity:1}.sym{flex:none}.tile .sym{width:calc(var(--tile,55px)*.63);height:calc(var(--tile,55px)*.63)}.sample-group{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}.sample-group .sym{width:calc(var(--tile,55px)*.63);height:calc(var(--tile,55px)*.63)}
.title{flex:1;min-width:0}.tools,.logo{flex-shrink:0}.choice{touch-action:none;user-select:none;-webkit-user-select:none}.inlineAudio{width:34px;height:34px;vertical-align:middle;border:0;border-radius:50%;padding:0;background:white;font-size:19px}.drag-preview{position:fixed;pointer-events:none;z-index:9999;opacity:.85;transform:translate(-50%,-50%)}
@media(max-width:600px){.story:not(.story-scene){flex-direction:column}.story .hero{max-height:22vh}.path{padding:9px}.endtext{line-height:1.3}}

/* Lesson-local audio notice containment. */
.header{min-height:62px;height:auto;flex-shrink:0}.tools{flex-shrink:0}.title{min-width:0}.audio-status{grid-column:1/-1;text-align:center;font-size:13px;line-height:1.2;overflow-wrap:anywhere}.lesson-home-slot{display:none}

const S2=[{seq:'ABAB',cards:['AB','BA','AAB']},{seq:'AABAAB',cards:['AAB','ABB','ABA']},{seq:'ABBABB',cards:['ABB','BAB','AB']}];
const S3=[{seq:'ABA_AB',unit:'AB'},{seq:'AABA_B',unit:'AAB'},{seq:'ABBA_B',unit:'ABB'}];
const S4=[{seq:'ABA AAB'.replaceAll(' ',''),unit:'AB'},{seq:'AABAAB'.split('').map((c,i)=>i===4?'B':c).join(''),unit:'AAB'},{seq:'ABBABB'.split('').map((c,i)=>i===2?'A':c).join(''),unit:'ABB'}];
function repeated(unit,len){return Array.from({length:len},(_,i)=>unit[i%unit.length]).join('')}
function minimalUnit(seq){for(let n=1;n<=3;n++){if(seq.length%n===0&&repeated(seq.slice(0,n),seq.length)===seq)return seq.slice(0,n)}return null}
function validPattern(seq){let u=minimalUnit(seq);return u&&[2,3].includes(u.length)&&new Set(u).size===2&&/^[AB]+$/.test(seq)?u:null}
function patternType(u){if(!u)return null;if(u.length===2)return'AB';return u[0]===u[1]?'AAB':u[1]===u[2]?'ABB':u[0]===u[2]?'AAB':'ABB'}
function validateS2Round(r){let solutions=r.cards.map((c,i)=>({c,i})).filter(({c})=>c.length<=3&&validPattern(repeated(c,r.seq.length))&&repeated(c,r.seq.length)===r.seq&&c===minimalUnit(r.seq));return{valid:solutions.length===1,solutionCount:solutions.length,solutions}}
function validateS3Round(r){let solutions=['A','B','C'].filter(c=>{let s=r.seq.replace('_',c);return s===repeated(r.unit,s.length)});return{valid:solutions.length===1,solutionCount:solutions.length,solutions}}
function validateS4Round(r){let solutions=[];for(let i=0;i<r.seq.length;i++)for(const c of ['A','B','C'])if(c!==r.seq[i]){let s=r.seq.slice(0,i)+c+r.seq.slice(i+1);if(s===repeated(r.unit,s.length))solutions.push({position:i,replacement:c})}return{valid:solutions.length===1,solutionCount:solutions.length,solutions}}
function validateS6ARound(){let a='ABACAB',b='ABABAB';let solutions=[...a].map((v,i)=>v!==b[i]?i:null).filter(v=>v!==null);return{valid:solutions.length===1,solutionCount:solutions.length,solutions}}
function checkValidators(){for(const [name,arr,fn] of [['S2',S2,validateS2Round],['S3',S3,validateS3Round],['S4',S4,validateS4Round]])arr.forEach((r,i)=>{let v=fn(r);if(!v.valid)console.error('VALIDATION FAILED',name,i,v)});if(!validateS6ARound().valid)console.error('VALIDATION FAILED S6A')}
