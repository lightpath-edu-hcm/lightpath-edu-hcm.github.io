vi:{title:'Số 0 và kệ hàng trống',story:'Bibo giúp mẹ mua 3 củ cà rốt. Con giúp Bibo nhé!',ready:'Con sẵn sàng',buy:'Con chạm từng củ cà rốt để Bibo mua nhé.',bought:'Bibo đã mua đủ 3 củ cà rốt. Kệ hàng bây giờ không còn gì!',remain:'Trên kệ còn củ cà rốt nào không?',no:'Không còn',yes:'Còn',check:'Kiểm tra',continue:'Tiếp tục',frame:'Con chạm từng chấm tròn. Mỗi lần chạm, con đọc to số chấm còn lại nhé!',symbol:'Kệ trống ứng với số nào?',basket:'Con hãy tìm giỏ có 0 củ cà rốt.',correct:'Chính xác! Đó là số 0.',correctBuy:'Chính xác! Có 0 củ cà rốt trên kệ.',correctFrame:'Chính xác! Khung không còn chấm nào. Có 0 chấm.',correctSymbol:'Chính xác! Số 0 biểu thị trên kệ không còn củ cà rốt nào.',correctBasket:'Chính xác! Giỏ này có 0 củ cà rốt.',again:'Con nhìn kỹ rồi thử lại nhé.',againFrame:'Con hãy lấy hết các chấm rồi kiểm tra lại nhé.',finishTitle:'Bibo cảm ơn con!',finish:'Bây giờ con hãy thử với vật thật nhé.',practice:'Đặt 3 vật thật vào một chiếc giỏ trống. Lấy hết ra rồi nói: “Không còn vật nào. Có 0 vật.”',replay:'Chơi lại',audio:'Âm thanh',back:'Quay lại'}};
const ANIMAL={
en:{questions:['How many cows are in the picture?','How many ducks are in the picture?','How many chicks are in the picture?','How many rabbits are in the picture?'],feedback:['Great! There is 1 cow in the picture.','Great! There are 2 ducks in the picture.','Great! There are 3 chicks in the picture.','Great! There are zero rabbits in the picture.']},
vi:{questions:['Trong tranh có bao nhiêu chú bò?','Trong tranh có bao nhiêu chú vịt?','Trong tranh có bao nhiêu chú gà con?','Trong tranh có bao nhiêu con thỏ?'],feedback:['Chính xác! Trong tranh có 1 chú bò.','Chính xác! Trong tranh có 2 chú vịt.','Chính xác! Trong tranh có 3 chú gà con.','Chính xác! Trong tranh có 0 con thỏ.']}};
const ANIMAL_ANSWERS=[1,2,3,0],ANIMAL_ORDERS=[[2,1,0,3],[0,3,2,1],[1,3,2,0],[3,1,0,2]];
const ANIMAL_ICONS=[IMG.cowIcon,IMG.duckIcon,IMG.chickIcon,IMG.rabbitIcon];
const randomDots=()=>1+Math.floor(Math.random()*5);
const S={lang:'en',screen:0,bought:0,moving:false,answer:null,checked:false,feedback:'',audio:true,dotsRemaining:randomDots(),numbers:[2,0,1],animalRound:0};
const app=document.getElementById('app'); const tx=()=>T[S.lang];
const Audio = {
  queue: [],
  mode: 'tts', activeSpeechId: null, activeUtterance: null, selectedVoice: null,
  voices: [], voicesReady: false, pendingSpeech: null, pendingTimer: null, generation: 0,
  notice: '', rate: { vi: .84, en: .88 }, pitch: 1.06, volume: 1,
  status(message = '') {
    this.notice = message;
    const bar = document.querySelector('.header');
    if (!bar) return;
    let label = bar.querySelector('#audio-status');
    if (!label && message) {
      label = document.createElement('span'); label.id = 'audio-status';
      label.className = 'audio-status'; label.setAttribute('role', 'status');
      bar.append(label);
    }
    if (label) { label.textContent = message; label.hidden = !message; }
  },
  stop() {
    this.queue.length = 0;
    this.generation += 1; clearTimeout(this.pendingTimer); this.pendingTimer = null;
    this.pendingSpeech = null; this.activeSpeechId = null;
    if (this.activeUtterance) { this.activeUtterance.onstart = null; this.activeUtterance.onend = null; this.activeUtterance.onerror = null; }
    this.activeUtterance = null;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    this.status();
  },
  loadVoices() {
    this.voices = 'speechSynthesis' in window ? window.speechSynthesis.getVoices() : [];
    this.voicesReady = this.voices.length > 0;
    return this.voices;
  },
  voice(language = 'en') {
    if (language !== 'en' || S.lang !== 'en') return null;
    const matching = this.loadVoices().filter(v => v.lang.toLowerCase().replace(/_/g, '-') === 'en-us');
    // Named voices only. Apple candidates still require audible device review.
    const voice = matching.find(v => /^Microsoft Zira(?: Desktop)? - English \(United States\)$/i.test(v.name))
      || matching.find(v => v.name === 'Tiếng Anh Hoa Kỳ' && v.voiceURI === 'Tiếng Anh Hoa Kỳ' && v.localService === true)
      || matching.find(v => /^Samantha(?: \((?:Enhanced|Premium|English \(United States\))\))?$/i.test(v.name))
      || matching.find(v => /^Ava(?: \((?:Enhanced|Premium|English \(United States\))\))?$/i.test(v.name))
      || null;
    this.selectedVoice = voice;
    return voice;
  },
  current(request) {
    return request.generation === this.generation && request.screen === `${S.screen}:${S.animalRound}`
      && request.session === S && S.lang === 'en' && S.audio;
  },
  dispatch(request, voice) {
    if (!this.current(request)) return;
    // Consume before speak, so later voiceschanged events cannot replay this request.
    this.pendingSpeech = null; clearTimeout(this.pendingTimer); this.pendingTimer = null;
    const utterance = new SpeechSynthesisUtterance(request.text);
    utterance.lang = 'en-US'; utterance.voice = voice;
    utterance.rate = this.rate.en; utterance.pitch = this.pitch; utterance.volume = this.volume;
    this.activeSpeechId = request.speechId; this.activeUtterance = utterance; this.status();
    utterance.onstart = () => { if (this.current(request)) this.status(); };
    utterance.onend = () => { if (this.activeUtterance === utterance) { this.activeSpeechId = null; this.activeUtterance = null; this.drain(); } };
    utterance.onerror = (event) => {
      console.error('[B4 native TTS error]', event.error, event);
      if (!this.current(request) || this.activeUtterance !== utterance) return;
      this.activeSpeechId = null; this.activeUtterance = null;
      this.queue.length = 0;
      this.status('Audio could not play. Turn Audio off, then on to retry.');
    };
    try {
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      window.speechSynthesis.speak(utterance);
     } catch (exception) {
      console.error('[B4 TTS synchronous exception]', exception);
      if (!this.current(request) || this.activeUtterance !== utterance) return;
      this.activeSpeechId = null; this.activeUtterance = null;
      this.queue.length = 0;
      this.status('Audio could not play. Turn Audio off, then on to retry.');
    }
  },
  drain() {
    if (this.activeUtterance || this.pendingSpeech) return;
    while (this.queue.length) {
      const item = this.queue.shift();
      if (this.current(item)) { this.request(item.speechId, item.text); return; }
    }
  },
  request(speechId, value) {
    if (S.lang !== 'en' || !S.audio || this.mode !== 'tts') return;
    if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
      this.status('English audio is unavailable on this browser.'); return;
    }
    const text = typeof value === 'string' ? value : ''; 
    if (!text) return;
    const request = { speechId, text, generation: this.generation, screen: `${S.screen}:${S.animalRound}`, session: S };
    if (this.activeUtterance || this.pendingSpeech) { this.queue.push(request); return; }
    const voice = this.voice('en');
    if (voice) { this.dispatch(request, voice); return; }
    this.pendingSpeech = request;
    this.status('Loading a female US English voice…');
    this.pendingTimer = setTimeout(() => {
      if (this.pendingSpeech !== request || !this.current(request)) return;
      this.pendingSpeech = null; this.pendingTimer = null; this.queue.length = 0;
      this.status('No supported female US English voice. Try Audio off/on.');
    }, 2500);
  },
  play(speechId, value) {
    this.request(speechId, value);
  },
  playEnglish(speechId, value) { this.request(speechId, value); },
  voicesChanged() {
    this.loadVoices();
    const request = this.pendingSpeech;
    if (!request) return;
    if (!this.current(request)) { this.pendingSpeech = null; clearTimeout(this.pendingTimer); this.pendingTimer = null; return; }
    const voice = this.voice('en');
    if (voice) this.dispatch(request, voice);
  }
};
if ('speechSynthesis' in window) window.speechSynthesis.addEventListener('voiceschanged', () => Audio.voicesChanged());
window.addEventListener('pagehide', () => Audio.stop());
const speak = (text) => Audio.play('lesson', text);
// Delayed narration belongs to its screen/audio generation.
function scheduleNarration(delay) {
  const request = { generation: Audio.generation, screen: `${S.screen}:${S.animalRound}`, session: S };
  setTimeout(() => { if (Audio.current(request)) narrateCurrent(); }, delay);
}

function currentNarration(){if(S.screen===0)return tx().story;if(S.screen===1)return S.bought===3?`${tx().bought} ${tx().remain}`:tx().buy;if(S.screen===2)return tx().frame;if(S.screen===3)return tx().symbol;if(S.screen===4)return ANIMAL[S.lang].questions[S.animalRound];return tx().finish}
function narrateCurrent(){speak(currentNarration(),S.screen===0?.7:.82)}
function header(){return `<header class="header"><button class="lesson-home-slot" type="button" aria-label="Về nhóm bài học" title="Về nhóm bài học" onclick="window.parent.postMessage({type:'lightpath:lesson-home'}, window.location.origin)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1v-9Z" /></svg></button><img class="logo" src="${IMG.logo}" alt="Light Path"><div class="title">${tx().title}</div><div class="tools">${S.lang==='en'?`<button data-action="audio" aria-label="${tx().audio}">${S.audio?'🔊':'🔇'}</button>`:''}<div class="lang"><button data-lang="vi" class="${S.lang==='vi'?'on':''}">VN</button><button data-lang="en" class="${S.lang==='en'?'on':''}">EN</button></div></div></header><div class="progress">${[0,1,2,3,4].map((_,i)=>`<i class="dot ${Math.min(S.screen,4)===i?'on':''}"></i>`).join('')}</div>`}
function correctFeedback(){return S.screen===1?tx().correctBuy:S.screen===2?tx().correctFrame:S.screen===3?tx().correctSymbol:S.screen===4?ANIMAL[S.lang].feedback[S.animalRound]:tx().correct}
function actionBar(){if(S.screen===0)return `<button class="primary" data-action="next">${tx().ready}</button>`;if(S.screen===5)return `<button class="primary" data-action="replay">${tx().replay}</button>`;const showNext=S.checked&&S.feedback==='correct',canCheck=S.screen!==1||S.bought===3,wrongText=S.screen===2?tx().againFrame:tx().again;return `${S.feedback?`<span class="feedback">${S.feedback==='correct'?correctFeedback():wrongText}</span>`:''}${showNext?`<button class="primary" data-action="next">${tx().continue}</button>`:canCheck?`<button class="primary" data-action="check">${tx().check}</button>`:''}<button class="back" data-action="back" aria-label="${tx().back}">←</button>`}
function content(){
 if(S.screen===0)return `<h1 class="prompt story-prompt"><span>${tx().story}</span>${S.lang==='en'?`<button class="story-audio" data-action="story-audio" aria-label="Listen to Bibo's story" title="Listen to Bibo's story">🔊</button>`:''}</h1><div class="stage"><div class="scene"><img src="${IMG.stock}" alt="Bibo and three carrots at the supermarket"></div></div>`;
 if(S.screen===1){const done=S.bought===3,base=[IMG.stock,IMG.one,IMG.two,IMG.full][S.bought];return `<h1 class="prompt">${done?tx().bought:tx().buy}</h1><div class="stage"><div class="scene"><img src="${base}" alt="Bibo and the carrot shelf">${!done?[0,1,2].map(i=>i<S.bought?'':`<button class="carrot" data-carrot="${i}" aria-label="carrot"></button>`).join(''):''}</div></div>${done?`<div class="question-box"><strong>${tx().remain}</strong><div class="row"><button class="choice ${S.answer==='no'?'selected':''}" data-answer="no">${tx().no}</button><button class="choice ${S.answer==='yes'?'selected':''}" data-answer="yes">${tx().yes}</button></div></div>`:''}`}
 if(S.screen===2)return `<h1 class="prompt">${tx().frame}</h1><div class="stage"><div class="tenframe empty-maker ${S.dotsRemaining===0?'done':''}" aria-label="${S.dotsRemaining} dots remain">${Array.from({length:10},(_,i)=>`<span class="cell">${i<S.dotsRemaining?`<button class="dot-button" data-remove-dot="${i}" aria-label="remove dot"></button>`:''}</span>`).join('')}</div></div>`;
 if(S.screen===3)return `<h1 class="prompt">${tx().symbol}</h1><div class="stage"><div class="split symbol-layout"><img src="${IMG.empty}" alt="empty carrot shelf"><div class="numbers">${S.numbers.map(n=>`<button class="card number ${S.answer===n?'selected':''}" data-number="${n}">${n}</button>`).join('')}</div></div></div>`;
 if(S.screen===4)return `<h1 class="prompt animal-prompt"><img src="${ANIMAL_ICONS[S.animalRound]}" alt=""><span>${ANIMAL[S.lang].questions[S.animalRound]}</span></h1><div class="stage"><div class="animal-game"><img src="${IMG.farm}" alt="farm picture with animals"><div class="animal-numbers">${ANIMAL_ORDERS[S.animalRound].map(n=>`<button class="card number ${S.answer===n?'selected':''}" data-number="${n}">${n}</button>`).join('')}</div><div class="round-dots">${[0,1,2,3].map(i=>`<i class="${i===S.animalRound?'on':''}"></i>`).join('')}</div></div></div>`;
 return `<h1 class="prompt">${tx().finish}</h1><div class="stage"><div class="finish"><img src="${IMG.practice}" alt="Bibo practicing with real carrots"><div class="finish-copy"><h2>${tx().finishTitle}</h2><p>${tx().practice}</p></div></div></div>`;
}
function render(){const screenClass=S.screen===1&&S.bought===3?' empty-shelf-done'+(S.feedback?' empty-shelf-feedback':''):'';app.innerHTML=header()+`<main class="main${screenClass}">${content()}<div class="actions">${actionBar()}</div></main>`}
function resetStep(){S.answer=null;S.checked=false;S.feedback=''}
function next(){if(S.screen===4&&S.animalRound<3){S.animalRound++;resetStep();render();speak(ANIMAL.en.questions[S.animalRound]);return}if(S.screen<5){S.screen++;resetStep();render();if(S.screen===1)speak(tx().buy);if(S.screen===2)speak(tx().frame);if(S.screen===4)speak(ANIMAL.en.questions[0])} }
app.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;
 if(el.dataset.lang){S.lang=el.dataset.lang;Audio.stop();render();if(S.lang==='en')scheduleNarration(80);return}
 const a=el.dataset.action;if(a==='story-audio'){speak(tx().story,.7);return}if(a==='audio'){S.audio=!S.audio;if(!S.audio)Audio.stop();render();if(S.audio)scheduleNarration(80);return}if(a==='next'){Audio.stop();next();return}if(a==='back'){Audio.stop();if(S.screen>0){S.screen--;if(S.screen<4)S.animalRound=0;resetStep();render()}return}if(a==='replay'){Audio.stop();Object.assign(S,{lang:'en',screen:0,bought:0,moving:false,answer:null,checked:false,feedback:'',dotsRemaining:randomDots(),animalRound:0});render();scheduleNarration(80);return}
 if(el.dataset.carrot!==undefined&&!S.moving&&S.bought<3){S.moving=true;const scene=el.closest('.scene'),r=el.getBoundingClientRect(),sr=scene.getBoundingClientRect(),fly=document.createElement('i');fly.className='flying-carrot';Object.assign(fly.style,{left:`${r.left}px`,top:`${r.top}px`,width:`${r.width}px`,height:`${r.height}px`});document.body.appendChild(fly);const audioContext={generation:Audio.generation,screen:`${S.screen}:${S.animalRound}`,session:S};const count=S.bought+1,naturalW=scene.querySelector('img').naturalWidth||1280,naturalH=scene.querySelector('img').naturalHeight||853;S.bought=count;render();const targetImage=document.querySelector('.scene>img'),targetBox=targetImage.getBoundingClientRect(),targetScale=Math.min(targetBox.width/naturalW,targetBox.height/naturalH),targetWidth=naturalW*targetScale,targetHeight=naturalH*targetScale,targetLeft=targetBox.left+(targetBox.width-targetWidth)/2+targetWidth*.31-r.width/2,targetTop=targetBox.top+(targetBox.height-targetHeight)/2+targetHeight*.68-r.height/2;speak(['one','two','three'][count-1]);requestAnimationFrame(()=>requestAnimationFrame(()=>{fly.style.left=`${targetLeft}px`;fly.style.top=`${targetTop}px`;fly.style.transform='scale(.55) rotate(-8deg)';fly.style.opacity='.2'}));setTimeout(()=>{fly.remove();S.moving=false;if(count===3)setTimeout(()=>{if(Audio.current(audioContext))speak(tx().bought+' '+tx().remain)},120)},760);return}
 if(el.dataset.removeDot!==undefined&&S.screen===2&&S.dotsRemaining>0){S.dotsRemaining--;S.checked=false;S.feedback='';const remaining=S.dotsRemaining;render();speak(['zero','one','two','three','four','five'][remaining]);return}
 if(el.dataset.answer){S.answer=el.dataset.answer;S.checked=false;S.feedback='';render();return}if(el.dataset.number!==undefined){S.answer=+el.dataset.number;S.checked=false;S.feedback='';speak(['zero','one','two','three'][S.answer]);render();return}
 if(a==='check'){let ok=false;if(S.screen===1)ok=S.bought===3&&S.answer==='no';else if(S.screen===2)ok=S.dotsRemaining===0;else if(S.screen===3)ok=S.answer===0;else if(S.screen===4)ok=S.answer===ANIMAL_ANSWERS[S.animalRound];S.checked=true;S.feedback=ok?'correct':'again';const voice=ok?correctFeedback():(S.screen===2?tx().againFrame:tx().again);render();speak(voice);return}
});render();scheduleNarration(500);
</script></body></html>
