const Audio = {
  queue: [],
  mode: 'tts', activeSpeechId: null, activeUtterance: null, selectedVoice: null,
  voices: [], voicesReady: false, pendingSpeech: null, pendingTimer: null, generation: 0,
  notice: '', rate: { vi: .84, en: .88 }, pitch: 1.06, volume: 1,
  status(message = '') {
    this.notice = message;
    const bar = document.querySelector('.head');
    if (!bar) return;
    let label = bar.querySelector('#audio-status');
    if (!label && message) {
      label = document.createElement('span'); label.id = 'audio-status';
      label.className = 'audio-status'; label.setAttribute('role', 'status');
      bar.append(label);
    }
    if (label) { label.textContent = message; label.hidden = !message; }
  },
  stop() {
    this.queue = [];
    this.generation += 1; clearTimeout(this.pendingTimer); this.pendingTimer = null;
    this.pendingSpeech = null; this.activeSpeechId = null;
    if (this.activeUtterance) { this.activeUtterance.onstart = null; this.activeUtterance.onend = null; this.activeUtterance.onerror = null; }
    this.activeUtterance = null;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    this.status();
  },
  loadVoices() {
    this.voices = 'speechSynthesis' in window ? window.speechSynthesis.getVoices() : [];
    this.voicesReady = this.voices.length > 0;
    return this.voices;
  },
  voice(language = 'en') {
    if (language !== 'en' || S.lang !== 'en') return null;
    const matching = this.loadVoices().filter(v => v.lang.toLowerCase().replace(/_/g, '-') === 'en-us');
    // Named voices only. Apple candidates still require audible device review.
    const voice = matching.find(v => /^Microsoft Zira(?: Desktop)? - English \(United States\)$/i.test(v.name))
      || matching.find(v => v.name === 'Tiếng Anh Hoa Kỳ' && v.voiceURI === 'Tiếng Anh Hoa Kỳ' && v.localService === true)
      || matching.find(v => /^Samantha(?: \((?:Enhanced|Premium|English \(United States\))\))?$/i.test(v.name))
      || matching.find(v => /^Ava(?: \((?:Enhanced|Premium|English \(United States\))\))?$/i.test(v.name))
      || null;
    this.selectedVoice = voice;
    return voice;
  },
  current(request) {
    return request.generation === this.generation && request.screen === speechKey()
      && request.session === S && S.lang === 'en' && S.audio;
  },
  drain() {
    while (this.queue.length && !this.activeUtterance) {
      const next = this.queue.shift();
      if (this.current(next.request)) this.dispatch(next.request, next.voice);
    }
  },
  dispatch(request, voice) {
    if (!this.current(request)) return;
    // Let the current word finish; navigation and Audio off still call stop().
    if (this.activeUtterance) { this.queue.push({ request, voice }); return; }
    // Consume before speak, so later voiceschanged events cannot replay this request.
    this.pendingSpeech = null; clearTimeout(this.pendingTimer); this.pendingTimer = null;
    const utterance = new SpeechSynthesisUtterance(request.text);
    utterance.lang = 'en-US'; utterance.voice = voice;
    utterance.rate = this.rate.en; utterance.pitch = this.pitch; utterance.volume = this.volume;
    this.activeSpeechId = request.speechId; this.activeUtterance = utterance; this.status();
    utterance.onstart = () => { if (this.current(request)) this.status(); };
    utterance.onend = () => { if (this.activeUtterance === utterance) { this.activeSpeechId = null; this.activeUtterance = null; this.drain(); } };
    utterance.onerror = () => {
      if (!this.current(request) || this.activeUtterance !== utterance) return;
      this.activeSpeechId = null; this.activeUtterance = null;
      this.status('Audio could not play. Turn Audio off, then on to retry.');
      this.queue = [];
    };
    try {
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      window.speechSynthesis.speak(utterance);
    } catch { utterance.onerror(); }
  },
  request(speechId, value) {
    if (S.lang !== 'en' || !S.audio || this.mode !== 'tts') return;
    if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
      this.status('English audio is unavailable on this browser.'); return;
    }
    const text = typeof value === 'string' ? value : ''; 
    if (!text) return;
    const request = { speechId, text, generation: this.generation, screen: speechKey(), session: S };
    const voice = this.voice('en');
    if (voice) { this.dispatch(request, voice); return; }
    this.pendingSpeech = request;
    this.status('Loading a female US English voice…');
    this.pendingTimer = setTimeout(() => {
      if (this.pendingSpeech !== request || !this.current(request)) return;
      this.pendingSpeech = null; this.pendingTimer = null;
      this.status('No supported female US English voice. Try Audio off/on.');
    }, 2500);
  },
  play(speechId, value) {
    this.request(speechId, value);
  },
  playEnglish(speechId, value) { this.request(speechId, value); },
  voicesChanged() {
    this.loadVoices();
    const request = this.pendingSpeech;
    if (!request) return;
    if (!this.current(request)) { this.pendingSpeech = null; clearTimeout(this.pendingTimer); this.pendingTimer = null; return; }
    const voice = this.voice('en');
    if (voice) this.dispatch(request, voice);
  }
};
if ('speechSynthesis' in window) window.speechSynthesis.addEventListener('voiceschanged', () => Audio.voicesChanged());

function speak(text){Audio.play('lesson',text)}

function s4(){let prompt=S.m4stage===0?t('m4q1'):S.m4stage===1?t('m4align'):t('m4q2'),body=`<div class="lengthWork">${pencilScene(S.m4stage===1)}${S.m4stage===0?options([{id:'yes',label:t('yes')},{id:'no',label:t('no')}]):''}${S.m4stage===1?`<div class="smallHint">${t('tapHint')}</div>`:''}${S.m4stage===2&&!S.m4done?options([{id:'a',label:t('pencilA')},{id:'b',label:t('pencilB')}]):''}</div>`,action=S.m4done?`<button class="btn primary" onclick="go(4)">${t('next')}</button>`:`<button class="btn check" onclick="checkM4()">${t('check')}</button>`;return frame(prompt,body,action)}

function choose(x){S.pick=x;S.feedback='';render()}
function alignRibbon(k){S.ribbons[k]=true;S.feedback='';render()}function dragItem(e,k){e.dataTransfer.setData('text/plain',k)}function dropRibbon(e){e.preventDefault();alignRibbon(e.dataTransfer.getData('text/plain'))}

function checkM2(){const ok=S.ribbons.yellow&&S.ribbons.blue;S.evidence.m2Checks.push({...S.ribbons,correct:ok});if(!ok){wrong();return}S.m2done=true;S.feedback=t('m2ok');speak(t('m2ok'));render()}
function checkM3(){S.evidence.m3.push(S.pick);if(S.pick!=='yellow'){wrong();return}S.m3done=true;S.feedback=t('m3ok');speak(t('m3ok'));render()}
function checkM4(){if(S.m4stage===0){S.evidence.m4.push({stage:0,pick:S.pick});if(S.pick!=='no'){wrong();return}S.m4stage=1;S.pick=null;S.feedback='';render();return}if(S.m4stage===1){const ok=S.pencils.a&&S.pencils.b;S.evidence.m4.push({stage:1,aligned:ok});if(!ok){wrong();return}S.m4stage=2;S.pick=null;S.feedback='';render();return}S.evidence.m4.push({stage:2,pick:S.pick});if(S.pick!=='b'){wrong();return}S.m4done=true;S.feedback=t('m4ok');speak(t('m4ok'));render()}
function selectUnit(){S.selectedUnit=true;S.feedback='';render()}function dragUnit(e){S.selectedUnit=true;e.dataTransfer.setData('text/plain','unit')}
function evidenceFor(screen){return screen===4?S.evidence.m5:S.evidence.m6}
function placedFor(kind){return kind==='m'?S.m5placed:kind==='a'?S.m6a:S.m6b}function setPlaced(kind,n){if(kind==='m')S.m5placed=n;else if(kind==='a')S.m6a=n;else S.m6b=n}
function tapRoad(e,kind){if(!S.selectedUnit)return;const r=e.currentTarget.getBoundingClientRect(),ratio=(e.clientX-r.left)/r.width,result=classifyDrop(kind,ratio);if(result==='valid')S.selectedUnit=false;S.feedback='';render()}
function classifyDrop(kind,ratio){const n=placedFor(kind),target=kind==='m'?5:kind==='a'?6:4,expected=n/target,tol=.11,e=evidenceFor(S.screen);if(n>=target){e.overlap++;return'unit-overlap'}if(ratio<-.05){e.wrongStart++;return'wrong-start'}if(ratio<expected-tol){e.overlap++;return'unit-overlap'}if(ratio>expected+tol){e.gap++;return'unit-gap'}setPlaced(kind,n+1);return'valid'}
function dropUnit(e,kind){e.preventDefault();const r=e.currentTarget.getBoundingClientRect(),ratio=(e.clientX-r.left)/r.width;classifyDrop(kind,ratio);S.selectedUnit=false;S.feedback='';render()}
function checkM5(){if(S.m5placed!==5){S.evidence.m5.retries++;wrong();return}S.m5done=true;S.feedback=t('m5ok');speak(t('m5say'));render()}
function checkM6Measure(){const kind=S.m6road,needed=kind==='a'?6:4,got=kind==='a'?S.m6a:S.m6b;if(got!==needed){S.evidence.m6.retries++;wrong();return}if(kind==='a'){S.m6road='b';S.selectedUnit=false;S.feedback='';render();speak(t('m6b'));return}S.m6measured=true;S.pick=null;S.feedback='';render();speak(t('m6q'))}
