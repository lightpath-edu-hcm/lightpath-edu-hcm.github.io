    while (this.queue.length && !this.activeUtterance) {
      const next = this.queue.shift();
      if (this.current(next.request)) this.dispatch(next.request, next.voice);
    }
  },
  dispatch(request, voice) {
    if (!this.current(request)) return;
    // Let the current word finish; navigation and Audio off still call stop().
    if (this.activeUtterance) { this.queue.push({ request, voice }); return; }
    // Consume before speak, so later voiceschanged events cannot replay this request.
    this.pendingSpeech = null; clearTimeout(this.pendingTimer); this.pendingTimer = null;
    const utterance = new SpeechSynthesisUtterance(request.text);
    utterance.lang = 'en-US'; utterance.voice = voice;
    utterance.rate = this.rate.en; utterance.pitch = this.pitch; utterance.volume = this.volume;
    this.activeSpeechId = request.speechId; this.activeUtterance = utterance; this.status();
    utterance.onstart = () => { if (this.current(request)) this.status(); };
    utterance.onend = () => { if (this.activeUtterance === utterance) { this.activeSpeechId = null; this.activeUtterance = null; this.drain(); } };
    utterance.onerror = () => {
      if (!this.current(request) || this.activeUtterance !== utterance) return;
      this.activeSpeechId = null; this.activeUtterance = null;
      this.status('Audio could not play. Turn Audio off, then on to retry.');
      this.queue = [];
    };
    try {
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      window.speechSynthesis.speak(utterance);
    } catch { utterance.onerror(); }
  },
  request(speechId, value) {
    if (S.lang !== 'en' || !S.audio || this.mode !== 'tts') return;
    if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
      this.status('English audio is unavailable on this browser.'); return;
    }
    const text = typeof value === 'string' ? value : ''; 
    if (!text) return;
    const request = { speechId, text, generation: this.generation, screen: speechKey(), session: S };
    const voice = this.voice('en');
    if (voice) { this.dispatch(request, voice); return; }
    this.pendingSpeech = request;
    this.status('Loading a female US English voice…');
    this.pendingTimer = setTimeout(() => {
      if (this.pendingSpeech !== request || !this.current(request)) return;
      this.pendingSpeech = null; this.pendingTimer = null;
      this.status('No supported female US English voice. Try Audio off/on.');
    }, 2500);
  },
  play(speechId, value) {
    this.request(speechId, value);
  },
  playEnglish(speechId, value) { this.request(speechId, value); },
  voicesChanged() {
    this.loadVoices();
    const request = this.pendingSpeech;
    if (!request) return;
    if (!this.current(request)) { this.pendingSpeech = null; clearTimeout(this.pendingTimer); this.pendingTimer = null; return; }
    const voice = this.voice('en');
    if (voice) this.dispatch(request, voice);
  }
};
if ('speechSynthesis' in window) window.speechSynthesis.addEventListener('voiceschanged', () => Audio.voicesChanged());
window.addEventListener('pagehide', () => Audio.stop());



function speak(text){Audio.play('lesson',text)}
function scheduleSpeech(text,delay,screen=S.screen){const generation=Audio.generation,key=speechKey();setTimeout(()=>{if(generation===Audio.generation&&screen===S.screen&&key===speechKey())speak(text)},delay)}

function head(){return`<header class="head"><button class="lesson-home-slot" type="button" aria-label="Về nhóm bài học" title="Về nhóm bài học" onclick="window.parent.postMessage({type:'lightpath:lesson-home'}, window.location.origin)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1v-9Z" /></svg></button><img class="logo" src="${A.logo}" alt="Light Path"><div class="title">${t('title')}</div><div class="tools"><button aria-label="Audio" onclick="toggleAudio()">${S.audio?'🔊':'🔇'}</button><button class="lang ${S.lang==='vi'?'on':''}" onclick="setLanguage('vi')">VN</button><button class="lang ${S.lang==='en'?'on':''}" onclick="setLanguage('en')">EN</button></div></header><div class="dots">${[0,1,2,3,4,5].map((_,i)=>`<i class="${i===S.screen?'on':''}"></i>`).join('')}</div>`}
function frame(prompt,body,actions='',back=true){return`${head()}<main class="main"><div class="prompt">${prompt}</div><div class="stage">${body}</div><div class="feedback" aria-live="polite">${S.feedback}</div><div class="actions">${actions}</div>${back?'<button class="back" aria-label="Back" onclick="back()">←</button>':''}</main>`}
function fruit(id='',handler=''){return`<button class="fruitBtn ${S.selected===id?'selected':''}" ${handler?`onclick="${handler}"`:''} aria-label="mandarin"><img class="fruit" draggable="false" src="${A.fruit}"></button>`}
function fruits(n){return Array.from({length:n},()=>`<img class="fruit" draggable="false" src="${A.fruit}">`).join('')}
function box(i){return`<button class="box ${S.selected==='box'+i?'selectedBox':''}" onclick="boxTap(${i})" ondragover="event.preventDefault()" ondrop="dropBox(event,${i})"><img src="${i?A.green:A.blue}" alt=""><span class="inside">${Array.from({length:S.boxes[i]},(_,k)=>`<span draggable="true" ondragstart="dragFromBox(event,${i})" onclick="event.stopPropagation();moveFromBox(${i})"><img class="fruit" draggable="false" src="${A.fruit}"></span>`).join('')}</span><span class="countBadge">${S.boxes[i]}</span></button>`}
function render(){app.innerHTML=[s1,s2,s3,s4,s5,s6][S.screen]()}
function s1(){let audio=S.lang==='en'?` <button class="inlineAudio" onclick="speak(t('story'))" aria-label="Replay story">🔊</button>`:'';return frame(`${t('story')}${audio}`,`<img class="story" src="${A.story}" alt="Bibo with five mandarins and two boxes">`,`<button class="btn primary" onclick="go(1)">${t('ready')}</button>`,false)}
function sourceFruit(){let left=5-S.boxes[0]-S.boxes[1];return`<div class="source" ondragover="event.preventDefault()" ondrop="dropSource(event)">${Array.from({length:left},(_,i)=>`<button class="fruitBtn ${S.selected==='source'?'selected':''}" draggable="true" ondragstart="dragSource(event)" onclick="selectSource()"><img class="fruit" draggable="false" src="${A.fruit}"></button>`).join('')}</div>`}
function s2(){let complete=S.boxes[0]+S.boxes[1]===5;let second=!!S.firstSplit;let prompt=second?t('different'):t('divide');let acts=S.phase==='done'?`<button class="btn primary" onclick="go(2)">${t('next')}</button>`:`<button class="btn check" ${complete?'':'disabled'} onclick="checkSplit()">${t('check')}</button>`;return frame(`${prompt}<small class="hint">${t('tap')}</small>`,`<div class="work">${sourceFruit()}<div class="boxes">${box(0)}${box(1)}</div></div>`,acts)}
const TARGETS=[[1,4],[2,3],[3,2],[4,1]];
function targetPrompt(target){if(S.lang==='vi')return`Con chuyển quýt để hai hộp có ${target[0]} quả và ${target[1]} quả nhé!`;let noun=n=>n===1?'mandarin':'mandarins';return`Move the mandarins so the boxes have ${target[0]} ${noun(target[0])} and ${target[1]} ${noun(target[1])}.`}
function s3(){let target=TARGETS[Math.min(S.targetIndex,TARGETS.length-1)],answering=S.phase==='answer'||S.phase==='totalDone';let p=answering?t('total'):targetPrompt(target);let actions;if(S.phase==='totalDone')actions=`<button class="btn primary" onclick="go(3)">${t('next')}</button>`;else if(answering)actions=`<div class="answerChoices">${[4,5,6].map(n=>`<button class="answer ${S.answer===n?'sel':''}" onclick="S.answer=${n};S.feedback='';render()">${n}</button>`).join('')}<button class="btn check" onclick="checkTotal()">${t('check')}</button></div>`;else actions=`<button class="btn check" onclick="checkTarget()">${t('check')}</button>`;return frame(p,`<div class="work"><div class="boxes">${box(0)}${box(1)}</div><div class="splitLabel">${S.boxes[0]} &nbsp;–&nbsp; ${S.boxes[1]}</div>${answering?'':`<div class="moveHelp">${t('tap')}</div>`}</div>`,actions)}
function bondView(parts){return`<div class="bond"><div class="whole">${fruits(5)}</div><div class="branches"></div><div class="parts">${parts.map((n,i)=>`<div class="part">${Array.from({length:n},(_,k)=>`<button class="fruitBtn ${k<S.bondCount[i]?'countedBtn':''}" onclick="countPart(${i},${k})"><img class="fruit" draggable="false" src="${A.fruit}"></button>`).join('')}${S.bondCount[i]===n?`<span class="partNum">${n}</span>`:''}</div>`).join('')}</div></div>`}
function s4(){let parts=S.bondRound===0?[2,3]:[1,4],done=S.bondCount[0]===parts[0]&&S.bondCount[1]===parts[1];let acts=S.phase==='done'?`<button class="btn primary" onclick="go(4)">${t('next')}</button>`:done?`<button class="btn check" onclick="nextBond()">${S.bondRound===0?t('next'):t('check')}</button>`:'';return frame(S.bondRound===0?t('bond'):t('bondNext'),bondView(parts),acts)}
function s5(){let r=S.missing[S.round];let answerShown=S.phase==='correct',known=`<div class="givenPart">${fruits(r.given)}${answerShown?`<span class="partNum">${r.given}</span>`:''}</div>`,missing=answerShown?`<div class="givenPart">${fruits(r.answer)}<span class="partNum">${r.answer}</span></div>`:`<div class="givenPart"><span class="question">?</span></div>`,parts=r.missingLeft?[missing,known]:[known,missing],choices=`<div class="choiceGrid">${r.options.map(n=>`<button class="choice ${S.choice===n?'sel':''}" onclick="S.choice=${n};S.feedback='';render()">${fruits(n)}</button>`).join('')}</div>`,acts=answerShown?`<button class="btn primary" onclick="nextMissing()">${t('next')}</button>`:`<button class="btn check" onclick="checkMissing()">${t('check')}</button>`,prompt=answerShown?splitConclusion(r):t('missing');return frame(prompt,`<div class="miniWrap"><div class="bond miniBond"><div class="whole">${fruits(5)}</div><div class="branches"></div><div class="parts">${parts.join('')}</div></div>${answerShown?'':choices}</div>`,acts)}
function s6(){return frame(t('thanks'),`<div class="finish"><img src="${A.bibo}" alt="Bibo"><div>${t('real')}<br><br><b>${t('bye')}</b></div></div>`,`<button class="btn primary" onclick="Audio.stop();S=fresh();render();scheduleSpeech(t('story'),250,0)">${t('again')}</button>`)}
function selectSource(){S.selected=S.selected==='source'?null:'source';render()}
function boxTap(i){if(S.selected==='source'){S.boxes[i]++;S.selected=null;speak(String(S.boxes[i]),false)}else if(S.selected==='box0'||S.selected==='box1'){let from=Number(S.selected.slice(-1));if(from!==i&&S.boxes[from]>0){S.boxes[from]--;S.boxes[i]++}S.selected=null}else S.selected='box'+i;S.feedback='';render()}
function moveFromBox(from){let to=1-from;if(S.boxes[from]>0){S.boxes[from]--;S.boxes[to]++;S.feedback='';render()}}
function dragSource(e){e.dataTransfer.setData('text/plain','source')}
function dragFromBox(e,i){e.stopPropagation();e.dataTransfer.setData('text/plain','box'+i)}
function dropBox(e,i){e.preventDefault();let x=e.dataTransfer.getData('text/plain');if(x==='source'){if(S.boxes[0]+S.boxes[1]<5)S.boxes[i]++}else if(x.startsWith('box')){let from=Number(x.slice(-1));if(from!==i&&S.boxes[from]>0){S.boxes[from]--;S.boxes[i]++}}S.selected=null;render()}
function dropSource(e){e.preventDefault();let x=e.dataTransfer.getData('text/plain');if(x.startsWith('box')){let from=Number(x.slice(-1));if(S.boxes[from]>0)S.boxes[from]--}render()}
function checkSplit(){let a=S.boxes[0],b=S.boxes[1];if(a+b!==5){S.feedback=t('try');speak(t('try'))}else if(!a||!b){S.feedback=t('both');speak(t('both'))}else{let key=[a,b].sort().join('-');if(!S.firstSplit){S.firstSplit=key;S.phase='second';S.feedback=t('correct');speak(t('correct'));S.boxes=[0,0]}else if(key===S.firstSplit){S.feedback=t('same');speak(t('same'))}else{S.phase='done';S.feedback=t('correct');speak(t('correct'))}}render()}
function checkTarget(){let q=TARGETS[S.targetIndex];if(S.boxes[0]===q[0]&&S.boxes[1]===q[1]){S.feedback=t('correct');speak(t('correct'));if(S.targetIndex===TARGETS.length-1){S.phase='answer';S.answer=null}else{S.targetIndex++;const generation=Audio.generation,key=speechKey();setTimeout(()=>{S.feedback='';render();if(generation===Audio.generation&&key===speechKey())speak(targetPrompt(TARGETS[S.targetIndex]))},650)}}else{S.feedback=t('try');speak(t('try'))}render()}
function checkTotal(){if(S.answer===5){S.phase='totalDone';S.feedback=t('correct');speak('Correct! Five mandarins.')}else{S.feedback=t('try');speak(t('try'))}render()}
function countPart(i,k){let parts=S.bondRound===0?[2,3]:[1,4];if(k!==S.bondCount[i]||S.bondCount[i]>=parts[i])return;S.bondCount[i]++;speak(String(S.bondCount[i]),false);render()}
function nextBond(){if(S.bondRound===0){S.bondRound=1;S.bondCount=[0,0];S.feedback='';speak(t('bondNext'))}else{S.phase='done';S.feedback=t('correct');speak(t('correct'))}render()}
function splitConclusion(r){let left=r.missingLeft?r.answer:r.given,right=r.missingLeft?r.given:r.answer;return S.lang==='vi'?`${left} quả và ${right} quả tạo thành 5 quả.`:`${left} and ${right} make five mandarins.`}
function checkMissing(){let r=S.missing[S.round];if(S.choice===r.answer){S.phase='correct';S.feedback=t('correct');speak(`${t('correct')} ${splitConclusion(r)}`)}else{S.feedback=t('try');speak(t('try'))}render()}
function nextMissing(){if(S.round===S.missing.length-1){go(5);return}S.round++;S.choice=null;S.phase='start';S.feedback='';render();speak(t('missing'))}
function go(n){Audio.stop();S.screen=n;S.phase='start';S.feedback='';S.selected=null;S.answer=null;if(n===1){S.boxes=[0,0];S.firstSplit=null}if(n===2){S.boxes=[1,4];S.targetIndex=1}if(n===3){S.bondRound=0;S.bondCount=[0,0]}if(n===4){S.round=0;S.choice=null}render();let prompts=[t('story'),t('divide'),targetPrompt(TARGETS[1]),t('bond'),t('missing'),t('thanks')];scheduleSpeech(prompts[n],120,n)}
function back(){if(S.screen===0)return;go(S.screen-1)}
function setLanguage(lang){S.lang=lang;if(S.screen===4&&S.phase==='correct')S.feedback=t('correct');Audio.stop();render()}
function toggleAudio(){S.audio=!S.audio;if(!S.audio)Audio.stop();render()}
S=fresh();render();scheduleSpeech(t('story'),350,0);
</script></body></html>
