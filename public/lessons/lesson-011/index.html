let S;
function t(k){return C[S.lang][k]}
function fmt(k,n){return t(k).replace('{n}',n)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function choicesFor(answer){let pool=[answer-1,answer,answer+1].filter(n=>n>=1&&n<=5);for(let n=1;pool.length<3&&n<=5;n++)if(!pool.includes(n))pool.push(n);return pool.sort((a,b)=>a-b)}
function modelOptions(target){let pool=[target-1,target,target+1].filter(n=>n>=6&&n<=10);for(let n=6;pool.length<3&&n<=10;n++)if(!pool.includes(n))pool.push(n);return pool.sort((a,b)=>a-b)}
function fresh(){let order=shuffle([6,7,8,9,10]);let concrete=order[0],frames=order.slice(1,4),models=shuffle(order).slice(0,2),missing=shuffle([6,7,8,9]).slice(0,2);missing.splice(Math.floor(Math.random()*3),0,10);return{lang:'en',audio:true,screen:0,phase:'start',feedback:'',concrete,added:0,answer:null,frames,frameRound:0,frameAdded:0,models,modelRound:0,modelChoice:null,missing,missingRound:0,missingChoice:null}}
function speechKey(){return [S.screen,S.phase,S.added,S.answer,S.selectedSupply,S.frameRound,S.frameAdded,S.modelRound,S.modelChoice,S.missingRound,S.missingChoice].join(':')}
const Audio = {
  queue: [],
  mode: 'tts', activeSpeechId: null, activeUtterance: null, selectedVoice: null,
  voices: [], voicesReady: false, pendingSpeech: null, pendingTimer: null, generation: 0,
  notice: '', rate: { vi: .84, en: .88 }, pitch: 1.06, volume: 1,
  status(message = '') {
    this.notice = message;
    const bar = document.querySelector('.head');
    if (!bar) return;
    let label = bar.querySelector('#audio-status');
    if (!label && message) {
      label = document.createElement('span'); label.id = 'audio-status';
      label.className = 'audio-status'; label.setAttribute('role', 'status');
      bar.append(label);
    }
    if (label) { label.textContent = message; label.hidden = !message; }
  },
  stop() {
    this.queue = [];
    this.generation += 1; clearTimeout(this.pendingTimer); this.pendingTimer = null;
    this.pendingSpeech = null; this.activeSpeechId = null;
    if (this.activeUtterance) { this.activeUtterance.onstart = null; this.activeUtterance.onend = null; this.activeUtterance.onerror = null; }
    this.activeUtterance = null;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    this.status();
  },
  loadVoices() {
    this.voices = 'speechSynthesis' in window ? window.speechSynthesis.getVoices() : [];
    this.voicesReady = this.voices.length > 0;
    return this.voices;
  },
  voice(language = 'en') {
    if (language !== 'en' || S.lang !== 'en') return null;
    const matching = this.loadVoices().filter(v => v.lang.toLowerCase().replace(/_/g, '-') === 'en-us');
    // Named voices only. Apple candidates still require audible device review.
    const voice = matching.find(v => /^Microsoft Zira(?: Desktop)? - English \(United States\)$/i.test(v.name))
      || matching.find(v => v.name === 'Tiếng Anh Hoa Kỳ' && v.voiceURI === 'Tiếng Anh Hoa Kỳ' && v.localService === true)
      || matching.find(v => /^Samantha(?: \((?:Enhanced|Premium|English \(United States\))\))?$/i.test(v.name))
      || matching.find(v => /^Ava(?: \((?:Enhanced|Premium|English \(United States\))\))?$/i.test(v.name))
      || null;
    this.selectedVoice = voice;
    return voice;
  },
  current(request) {
    return request.generation === this.generation && request.screen === speechKey()
      && request.session === S && S.lang === 'en' && S.audio;
  },
  drain() {
    while (this.queue.length && !this.activeUtterance) {
      const next = this.queue.shift();
      if (this.current(next.request)) this.dispatch(next.request, next.voice);
    }
  },
  dispatch(request, voice) {
    if (!this.current(request)) return;
    // Let the current word finish; navigation and Audio off still call stop().
    if (this.activeUtterance) { this.queue.push({ request, voice }); return; }
    // Consume before speak, so later voiceschanged events cannot replay this request.
    this.pendingSpeech = null; clearTimeout(this.pendingTimer); this.pendingTimer = null;
    const utterance = new SpeechSynthesisUtterance(request.text);
    utterance.lang = 'en-US'; utterance.voice = voice;
    utterance.rate = this.rate.en; utterance.pitch = this.pitch; utterance.volume = this.volume;
    this.activeSpeechId = request.speechId; this.activeUtterance = utterance; this.status();
    utterance.onstart = () => { if (this.current(request)) this.status(); };
    utterance.onend = () => { if (this.activeUtterance === utterance) { this.activeSpeechId = null; this.activeUtterance = null; this.drain(); } };
    utterance.onerror = () => {
      if (!this.current(request) || this.activeUtterance !== utterance) return;
      this.activeSpeechId = null; this.activeUtterance = null;
      this.status('Audio could not play. Turn Audio off, then on to retry.');
      this.queue = [];
    };
    try {
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      window.speechSynthesis.speak(utterance);
    } catch { utterance.onerror(); }
  },
  request(speechId, value) {
    if (S.lang !== 'en' || !S.audio || this.mode !== 'tts') return;
    if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
      this.status('English audio is unavailable on this browser.'); return;
    }
    const text = typeof value === 'string' ? value : ''; 
    if (!text) return;
    const request = { speechId, text, generation: this.generation, screen: speechKey(), session: S };
    const voice = this.voice('en');
    if (voice) { this.dispatch(request, voice); return; }
    this.pendingSpeech = request;
    this.status('Loading a female US English voice…');
    this.pendingTimer = setTimeout(() => {
      if (this.pendingSpeech !== request || !this.current(request)) return;
      this.pendingSpeech = null; this.pendingTimer = null;
      this.status('No supported female US English voice. Try Audio off/on.');
    }, 2500);
  },
  play(speechId, value) {
    this.request(speechId, value);
  },
  playEnglish(speechId, value) { this.request(speechId, value); },
  voicesChanged() {
    this.loadVoices();
    const request = this.pendingSpeech;
    if (!request) return;
    if (!this.current(request)) { this.pendingSpeech = null; clearTimeout(this.pendingTimer); this.pendingTimer = null; return; }
    const voice = this.voice('en');
    if (voice) this.dispatch(request, voice);
  }
};
if ('speechSynthesis' in window) window.speechSynthesis.addEventListener('voiceschanged', () => Audio.voicesChanged());
window.addEventListener('pagehide', () => Audio.stop());



function speak(text){Audio.play('lesson',text)}
function scheduleSpeech(text,delay,screen=S.screen){const generation=Audio.generation,key=speechKey();setTimeout(()=>{if(generation===Audio.generation&&screen===S.screen&&key===speechKey())speak(text)},delay)}

function head(){return`<header class="head"><button class="lesson-home-slot" type="button" aria-label="Về nhóm bài học" title="Về nhóm bài học" onclick="window.parent.postMessage({type:'lightpath:lesson-home'}, window.location.origin)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1v-9Z" /></svg></button><img class="logo" src="${A.logo}" alt="Light Path"><div class="title">${t('title')}</div><div class="tools"><button aria-label="Audio" onclick="toggleAudio()">${S.audio?'🔊':'🔇'}</button><button class="lang ${S.lang==='vi'?'on':''}" onclick="setLanguage('vi')">VN</button><button class="lang ${S.lang==='en'?'on':''}" onclick="setLanguage('en')">EN</button></div></header><div class="dots">${[0,1,2,3,4,5].map((_,i)=>`<i class="${i===S.screen?'on':''}"></i>`).join('')}</div>`}
function frame(prompt,body,actions='',back=true){return`${head()}<main class="main"><div class="prompt">${prompt}</div><div class="stage">${body}</div><div class="feedback" aria-live="polite">${S.feedback}</div><div class="actions">${actions}</div>${back?'<button class="back" aria-label="Back" onclick="back()">←</button>':''}</main>`}
function render(){app.innerHTML=[s1,s2,s3,s4,s5,s6][S.screen]()}
function s1(){let audio=S.lang==='en'?` <button class="inlineAudio" onclick="speak(t('story'))" aria-label="Replay story">🔊</button>`:'';return frame(`${t('story')}${audio}`,`<img class="story" src="${A.story}" alt="Bibo with five balls and empty spaces">`,`<button class="btn primary" onclick="go(1)">${t('ready')}</button>`,false)}
function ball(more=false){return`<i class="ball ${more?'more':''}"></i>`}
function rack(){return`<div class="ballRack">${Array.from({length:10},(_,i)=>`<div class="rackSlot" ${i>=5+S.added?`onclick="placeBall()" role="button" aria-label="empty space"`:''}>${i<5?`<span class="ballBtn">${ball()}</span>`:i<5+S.added?`<button class="ballBtn" onclick="event.stopPropagation();removeBall()">${ball(true)}</button>`:`<span class="ballBtn"></span>`}</div>`).join('')}</div>`}
function supply(){return`<div class="supply ${S.selectedSupply?'selected':''}" onclick="selectSupply()" role="button" aria-label="blue ball area">${Array.from({length:5-S.added},()=>`<button class="ballBtn ${S.selectedSupply?'selected':''}" onclick="event.stopPropagation();selectSupply()">${ball(true)}</button>`).join('')}</div>`}
function addChoices(answer,selected,key){return`<div class="addChoices">${choicesFor(answer).map(n=>`<button class="addChoice ${selected===n?'sel':''}" onclick="${key}=${n};S.feedback='';render()">${n}</button>`).join('')}</div>`}
function concreteConclusion(){return S.lang==='vi'?`5 và thêm ${S.concrete-5} tạo thành ${S.concrete}.`:`5 and ${S.concrete-5} make ${S.concrete}.`}
function s2(){let prompt=S.phase==='answer'?t('added'):S.phase==='correct'?concreteConclusion():fmt('build',S.concrete),actions;if(S.phase==='start')actions=`<button class="btn check" onclick="checkBuild()">${t('check')}</button>`;else if(S.phase==='answer')actions=`${addChoices(S.concrete-5,S.answer,'S.answer')}<button class="btn check" onclick="checkAdded()">${t('check')}</button>`;else actions=`<button class="btn primary" onclick="go(2)">${t('next')}</button>`;return frame(`${prompt}${S.phase==='start'?`<small class="hint">${t('tap')}</small>`:''}`,`<div class="fiveWork"><div class="targetCard">${S.concrete}</div>${rack()}${S.phase==='start'?supply():''}</div>`,actions)}
function frameView(target,interactive=true){return`<div class="frameInteractive">${Array.from({length:10},(_,i)=>{let fixed=i<5,on=i>=5&&i<5+S.frameAdded;return`<button class="frameCell ${i>=5&&interactive?'active':''} ${on?'selected':''}" ${i>=5&&interactive?`onclick="toggleFrame(${i-5})"`:''}>${fixed?'<i class="dot"></i>':on?'<i class="dot blue"></i>':''}</button>`}).join('')}</div>`}
function frameConclusion(target){return S.lang==='vi'?`5 và thêm ${target-5} tạo thành ${target}.`:`5 and ${target-5} make ${target}.`}
function s3(){let target=S.frames[S.frameRound],done=S.phase==='correct',actions=done?`<button class="btn primary" onclick="nextFrame()">${t('next')}</button>`:`<button class="btn check" onclick="checkFrame()">${t('check')}</button>`;return frame(done?frameConclusion(target):fmt('frame',target),`<div class="fiveWork"><div class="targetCard">${target}</div>${frameView(target,!done)}</div>`,actions)}
function staticFrame(total){return`<div class="tenFrame">${Array.from({length:10},(_,i)=>`<span class="cell">${i<total?`<i class="dot ${i>=5?'blue':''}"></i>`:''}</span>`).join('')}</div>`}
function s4(){let target=S.models[S.modelRound],options=modelOptions(target),done=S.phase==='correct',actions=done?`<button class="btn primary" onclick="nextModel()">${t('next')}</button>`:`<button class="btn check" onclick="checkModel()">${t('check')}</button>`;return frame(done?frameConclusion(target):fmt('model',target),`<div class="modelChoices">${options.map(n=>`<button class="modelCard ${S.modelChoice===n?'sel':''}" onclick="S.modelChoice=${n};S.feedback='';render()">${staticFrame(n)}</button>`).join('')}</div>`,actions)}
function s5(){let target=S.missing[S.missingRound],answer=target-5,done=S.phase==='correct',actions=done?`<button class="btn primary" onclick="nextMissing()">${t('next')}</button>`:`${addChoices(answer,S.missingChoice,'S.missingChoice')}<button class="btn check" onclick="checkMissing()">${t('check')}</button>`;return frame(done?frameConclusion(target):fmt('missing',target),`<div class="symbolBond"><div class="total10">${target}</div><div class="branch10"></div><div class="symbolParts"><div class="symbolPart">5</div><div class="symbolPart">${done?answer:'?'}</div></div></div>`,actions)}
function s6(){return frame(t('thanks'),`<div class="finish"><img src="${A.bibo}" alt="Bibo"><div>${t('real')}<br><br><b>${t('bye')}</b></div></div>`,`<button class="btn primary" onclick="Audio.stop();S=fresh();render();scheduleSpeech(t('story'),250,0)">${t('again')}</button>`)}
function selectSupply(){S.selectedSupply=true;S.feedback='';render()}
function placeBall(){if(!S.selectedSupply||S.added>=5)return;S.added++;S.selectedSupply=false;speak(String(5+S.added));render()}
function removeBall(){if(S.added>0){S.added--;S.selectedSupply=false;S.feedback='';render()}}
function checkBuild(){if(5+S.added===S.concrete){S.phase='answer';S.answer=null;S.feedback=t('correct');speak(`${t('correct')} ${t('added')}`)}else{S.feedback=t('try');speak(t('try'))}render()}
function checkAdded(){if(S.answer===S.concrete-5){S.phase='correct';S.feedback=t('correct');speak(`${t('correct')} ${concreteConclusion()}`)}else{S.feedback=t('try');speak(t('try'))}render()}
function toggleFrame(i){if(i===S.frameAdded&&S.frameAdded<5)S.frameAdded++;else if(i===S.frameAdded-1)S.frameAdded--;S.feedback='';render()}
function checkFrame(){let target=S.frames[S.frameRound];if(5+S.frameAdded===target){S.phase='correct';S.feedback=t('correct');speak(`${t('correct')} ${frameConclusion(target)}`)}else{S.feedback=t('try');speak(t('try'))}render()}
function nextFrame(){if(S.frameRound===S.frames.length-1){go(3);return}S.frameRound++;S.frameAdded=0;S.phase='start';S.feedback='';render();speak(fmt('frame',S.frames[S.frameRound]))}
function checkModel(){let target=S.models[S.modelRound];if(S.modelChoice===target){S.phase='correct';S.feedback=t('correct');speak(`${t('correct')} ${frameConclusion(target)}`)}else{S.feedback=t('try');speak(t('try'))}render()}
function nextModel(){if(S.modelRound===S.models.length-1){go(4);return}S.modelRound++;S.modelChoice=null;S.phase='start';S.feedback='';render();speak(fmt('model',S.models[S.modelRound]))}
function checkMissing(){let target=S.missing[S.missingRound];if(S.missingChoice===target-5){S.phase='correct';S.feedback=t('correct');speak(`${t('correct')} ${frameConclusion(target)}`)}else{S.feedback=t('try');speak(t('try'))}render()}
function nextMissing(){if(S.missingRound===S.missing.length-1){go(5);return}S.missingRound++;S.missingChoice=null;S.phase='start';S.feedback='';render();speak(fmt('missing',S.missing[S.missingRound]))}
function go(n){Audio.stop();S.screen=n;S.phase='start';S.feedback='';if(n===1){S.added=0;S.answer=null;S.selectedSupply=false}if(n===2){S.frameRound=0;S.frameAdded=0}if(n===3){S.modelRound=0;S.modelChoice=null}if(n===4){S.missingRound=0;S.missingChoice=null}render();let prompts=[t('story'),fmt('build',S.concrete),fmt('frame',S.frames[0]),fmt('model',S.models[0]),fmt('missing',S.missing[0]),t('thanks')];scheduleSpeech(prompts[n],120,n)}
function back(){if(S.screen===0)return;go(S.screen-1)}
function setLanguage(lang){S.lang=lang;if(S.phase==='correct')S.feedback=t('correct');Audio.stop();render()}
function toggleAudio(){S.audio=!S.audio;if(!S.audio)Audio.stop();render()}
S=fresh();render();scheduleSpeech(t('story'),350,0);
</script></body></html>
