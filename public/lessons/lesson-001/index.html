<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d6b68" />
    <title>Topic 1 – Count Each Object Once</title>
    <style>
:root {
  --ink: #173b3b;
  --teal: #0d6b68;
  --teal-dark: #08514f;
  --sun: #ffca4b;
  --cream: #fffaf0;
  --sky: #dff6f3;
  --coral: #f26b5b;
  --white: #ffffff;
  --shadow: 0 14px 40px rgba(19, 73, 70, 0.16);
}

* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {
  margin: 0;
  color: var(--ink);
  font-family: "Times New Roman", Times, serif;
  background:
    radial-gradient(circle at 10% 12%, rgba(255,202,75,.45), transparent 25%),
    radial-gradient(circle at 90% 85%, rgba(83,190,177,.35), transparent 30%),
    linear-gradient(155deg, #f9fffd, #e4f8f5);
  min-height: 100vh;
  min-height: 100svh;
}

button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

#app {
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: max(14px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
}

.lesson {
  width: min(100%, 760px);
  min-height: min(850px, calc(100vh - 28px));
  min-height: min(850px, calc(100svh - 28px));
  background: rgba(255,255,255,.94);
  border: 3px solid rgba(13,107,104,.15);
  border-radius: 32px;
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  padding: 14px 18px;
  gap: 12px;
  background: var(--teal);
  color: white;
}

.brand { display: flex; align-items: center; gap: 8px; min-width: 0; justify-self: start; }
.brand-logo { width: 60px; height: 60px; object-fit: contain; object-position: center; filter: drop-shadow(0 0 7px rgba(94, 222, 255, .48)); }
.brand-slogan { justify-self: center; color: white; font-size: 1.44rem; font-style: italic; font-weight: 600; line-height: 1.2; white-space: nowrap; }
.brand-slogan span { display: block; }
.brand-slogan span + span { padding-left: 5.9em; }
.language-switch { display: inline-flex; justify-self: end; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,.17); }
.lang-btn { min-width: 48px; min-height: 40px; border: 0; border-radius: 10px; color: white; background: transparent; font-weight: 900; cursor: pointer; }
.lang-btn.active { background: white; color: var(--teal-dark); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.step-dots { display: flex; justify-self: end; gap: 6px; }
.step-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.35); }
.step-dot.on { background: var(--sun); transform: scale(1.18); }

.icon-btn {
  min-width: 46px;
  min-height: 46px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.18);
  color: white;
  cursor: pointer;
}

.sound-row {
  display: flex;
  justify-content: flex-end;
  padding: 9px clamp(18px, 4vw, 34px) 0;
}
.sound-toggle {
  width: 46px;
  height: 46px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 2px solid rgba(13,107,104,.25);
  border-radius: 50%;
  background: var(--sky);
  color: var(--teal-dark);
  box-shadow: 0 4px 10px rgba(13,107,104,.12);
  font-family: Arial, sans-serif;
  font-size: 1.35rem;
  line-height: 1;
  cursor: pointer;
}
.sound-toggle:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: clamp(18px, 4vw, 34px);
}

.back-row { display: flex; justify-content: flex-end; padding: 0 clamp(18px, 4vw, 34px) 16px; }
.back-btn {
  width: 46px;
  height: 46px;
  padding: 0;
  border: 2px solid rgba(13,107,104,.24);
  border-radius: 50%;
  background: var(--sky);
  color: var(--teal-dark);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
}
.back-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.story { justify-content: center; text-align: center; }
.eyebrow { margin: 0 0 8px; color: var(--teal); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: .82rem; }
h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.35rem); line-height: 1.05; }
.lead { font-size: clamp(1.05rem, 3vw, 1.3rem); line-height: 1.5; max-width: 560px; margin: 14px auto 20px; }

.story-scene {
  min-height: 260px;
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  align-items: end;
  margin: 8px 0 20px;
  border-radius: 26px;
  background: linear-gradient(#dff8ff 0 64%, #a8df91 64%);
  overflow: hidden;
  border: 2px solid rgba(13,107,104,.12);
  padding: 18px;
}

.topic-title { color: var(--teal-dark); font-size: clamp(1.05rem, 3.7vw, 1.8rem); line-height: 1.2; letter-spacing: .015em; }
.bibo-image { width: 100%; max-height: 230px; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 10px 6px rgba(34,72,45,.18)); z-index: 1; }
.story-copy { margin: 0 auto 14px; font-weight: 700; }
.story-label { color: var(--teal-dark); font-weight: 900; }
.story-boxes { position: relative; min-height: 190px; }
.story-boxes span { position: absolute; font-size: clamp(2.8rem, 10vw, 4.8rem); filter: drop-shadow(0 6px 4px rgba(0,0,0,.15)); }
.story-boxes span:nth-child(1) { left: 4%; bottom: 4%; transform: rotate(-12deg); }
.story-boxes span:nth-child(2) { left: 34%; bottom: 33%; transform: rotate(9deg); }
.story-boxes span:nth-child(3) { right: 4%; bottom: 8%; transform: rotate(-5deg); }
.story-boxes span:nth-child(4) { left: 9%; top: 3%; transform: rotate(7deg); }
.story-boxes span:nth-child(5) { right: 14%; top: 2%; transform: rotate(-10deg); }

.primary, .secondary, .answer-btn {
  min-height: 54px;
  border-radius: 18px;
  border: 0;
  font-weight: 800;
  cursor: pointer;
}
.primary { background: var(--coral); color: white; padding: 0 26px; box-shadow: 0 6px 0 #c94b3f; }
.primary:active { transform: translateY(3px); box-shadow: 0 3px 0 #c94b3f; }
.secondary { background: var(--sky); color: var(--teal-dark); padding: 0 20px; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: auto; padding-top: 18px; }

.teacher-panel {
  margin-top: 16px;
  border-top: 1px dashed rgba(13,107,104,.28);
  padding-top: 14px;
}
.teacher-panel summary { cursor: pointer; color: var(--teal); font-weight: 700; }
.teacher-options { display: grid; gap: 8px; text-align: left; margin: 12px auto 0; max-width: 520px; }
.teacher-options label { display: flex; gap: 10px; align-items: flex-start; background: var(--cream); padding: 10px 12px; border-radius: 12px; }

.instruction-wrap { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; margin-bottom: 14px; }
.bibo-mini { width: 64px; height: 72px; object-fit: contain; object-position: center; filter: drop-shadow(0 5px 4px rgba(34,72,45,.15)); }
.speech {
  position: relative;
  background: var(--sky);
  border-radius: 18px;
  padding: 13px 16px;
  font-size: clamp(1rem, 3vw, 1.18rem);
  font-weight: 700;
  line-height: 1.35;
}
.speech small { display: block; font-size: .75rem; opacity: .65; margin-bottom: 2px; text-transform: uppercase; letter-spacing: .05em; }
.instruction-only {
  margin: 0 auto 14px;
  padding: 13px 20px;
  max-width: 620px;
  border-radius: 18px;
  background: var(--sky);
  color: var(--teal-dark);
  font-size: clamp(1rem, 3vw, 1.18rem);
  font-weight: 800;
  line-height: 1.35;
  text-align: center;
}

.play-area {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(140px, .75fr) minmax(235px, 1.25fr);
  gap: clamp(12px, 3vw, 26px);
  align-items: stretch;
  min-height: 390px;
}

.zone {
  border-radius: 24px;
  padding: 14px;
  border: 2px dashed rgba(13,107,104,.25);
  background: #f9fffe;
}
.object-bank {
  display: grid;
  place-items: center;
  min-width: 0;
  padding: 8px;
}
.zone-title { margin: 0 0 12px; font-size: .9rem; font-weight: 800; color: var(--teal); text-align: center; }
.objects { display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 8px; min-height: 300px; }

.object {
  width: clamp(46px, 8vw, 58px);
  height: clamp(46px, 8vw, 58px);
  display: grid;
  place-items: center;
  font-size: clamp(1.85rem, 6vw, 2.55rem);
  border-radius: 15px;
  background: white;
  box-shadow: 0 5px 13px rgba(20,76,73,.15);
  cursor: grab;
  user-select: none;
  touch-action: none;
  position: relative;
  z-index: 2;
  transition: transform .16s ease, opacity .16s ease;
}
.object:active { cursor: grabbing; transform: scale(1.07); }
.object.dragging { position: fixed; pointer-events: none; z-index: 99; transform: scale(1.12) rotate(3deg); opacity: .94; }
.object.placed { box-shadow: none; background: transparent; width: 72%; height: 72%; max-width: 72%; max-height: 72%; font-size: clamp(1.45rem, 4.5vw, 2.2rem); line-height: 1; }

.ten-frame {
  display: grid;
  grid-template-columns: repeat(5, minmax(48px, 1fr));
  grid-template-rows: repeat(2, clamp(82px, 12vh, 105px));
  column-gap: 7px;
  row-gap: clamp(6px, .7vw, 10px);
  min-height: 0;
}
.slot {
  min-height: 0;
  border: 3px solid rgba(13,107,104,.38);
  border-radius: 15px;
  display: grid;
  place-items: center;
  background: white;
  position: relative;
  transition: background .15s, transform .15s;
}
.slot.target { background: #fff1b8; transform: scale(1.03); }
.slot.filled { border-style: solid; border-color: var(--teal); background: #f1fffc; }

.fish-screen { gap: 6px; }
.aquarium {
  flex: 1;
  min-height: clamp(210px, 34vh, 270px);
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 5px solid #77c7df;
  border-top-color: #bcebf5;
  border-radius: 26px 26px 38px 38px;
  background:
    radial-gradient(circle at 16% 22%, rgba(255,255,255,.8) 0 5px, transparent 6px),
    radial-gradient(circle at 82% 36%, rgba(255,255,255,.65) 0 7px, transparent 8px),
    radial-gradient(circle at 66% 76%, rgba(255,255,255,.48) 0 4px, transparent 5px),
    linear-gradient(180deg, #d9f7ff 0%, #83d8ee 54%, #43b4d4 100%);
  box-shadow: inset 0 12px 24px rgba(255,255,255,.35), 0 10px 22px rgba(24,124,154,.16);
}
.fish-school {
  width: 100%;
  min-height: clamp(190px, 30vh, 240px);
  display: grid;
  grid-template-columns: repeat(5, minmax(52px, 1fr));
  grid-auto-rows: minmax(96px, 1fr);
  place-items: center;
  gap: 8px;
  padding: 18px;
}
.fish {
  width: clamp(54px, 9vw, 68px);
  height: clamp(54px, 9vw, 68px);
  position: relative;
  display: grid;
  place-items: center;
  border: 2px solid rgba(255,255,255,.72);
  border-radius: 50%;
  background: rgba(255,255,255,.25);
  color: var(--ink);
  cursor: pointer;
  touch-action: manipulation;
}
.fish-icon {
  display: block;
  font-size: clamp(2rem, 6vw, 2.8rem);
  line-height: 1;
  filter: drop-shadow(0 4px 3px rgba(12,82,108,.2));
  animation: fish-swim var(--fish-speed) ease-in-out var(--fish-delay) infinite alternate;
}
.fish-reverse .fish-icon { animation-direction: alternate-reverse; }
.fish-tick {
  position: absolute;
  top: -5px;
  right: -5px;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 3px solid white;
  border-radius: 50%;
  background: #159468;
  color: white;
  font-family: Arial, sans-serif;
  font-size: 1rem;
  font-weight: 900;
  opacity: 0;
  transform: scale(.55);
  transition: opacity .16s ease, transform .16s ease;
}
.fish.counted {
  border-color: white;
  background: rgba(255,255,255,.7);
  box-shadow: 0 0 0 3px rgba(21,148,104,.32);
}
.fish.counted .fish-icon { animation-play-state: paused; opacity: .68; }
.fish.counted .fish-tick { opacity: 1; transform: scale(1); }
.fish:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }

@keyframes fish-swim {
  from { transform: translate(-8px, 2px) rotate(-2deg); }
  to { transform: translate(8px, -2px) rotate(2deg); }
}
.count-badge {
  position: absolute;
  right: 4px;
  top: 3px;
  min-width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--teal);
  color: white;
  font-weight: 900;
  font-size: .82rem;
  display: grid;
  place-items: center;
}

.feedback { min-height: 48px; text-align: center; font-weight: 800; padding: 10px; color: var(--teal-dark); }
.correct-praise, .result-line { display: block; }
.correct-praise { margin-bottom: 4px; }
.feedback.count-display { font-size: clamp(2rem, 8vw, 3rem); line-height: 1; color: var(--coral); text-transform: lowercase; }
.feedback.error { color: #9d342a; }
.answers { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.answer-btn { min-width: 72px; padding: 0 22px; background: #fff; color: var(--teal); border: 3px solid var(--teal); font-size: 1.6rem; }
.answer-btn:hover, .answer-btn:focus-visible { background: var(--sky); }

/* Screen 5: cards are deliberately passive in 5A; matching is added in 5B. */
.english-review-screen { flex: 0 0 auto; gap: clamp(8px, 1.5vh, 14px); padding-bottom: 10px; }
.english-review-board {
  width: min(680px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(10px, 2vw, 24px);
}
.english-card-column { display: grid; gap: clamp(9px, 1.5vh, 14px); align-content: start; }
.english-card {
  min-height: clamp(72px, 12vh, 112px);
  width: 100%;
  padding: clamp(8px, 1.5vw, 14px);
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 18px;
  color: var(--teal-dark);
  font-weight: 900;
  line-height: 1.1;
  touch-action: manipulation;
  box-shadow: 0 5px 0 rgba(11, 91, 95, .34);
}
.english-card-left { background: var(--sky); border: 2px solid var(--teal); }
.english-card-right { background: var(--coral); color: #fff; font-size: clamp(1.05rem, 3vw, 1.55rem); text-align: center; box-shadow: 0 5px 0 #c94b3f; }
.english-card:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(11, 91, 95, .34); }
.english-card-right:active { box-shadow: 0 2px 0 #c94b3f; }
.english-card:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.english-card.selected { outline: 4px solid var(--sun); outline-offset: 2px; }
.english-card.matched { background: #159468; color: #fff; box-shadow: 0 5px 0 #0e704e; }
.english-number { font-size: clamp(2.5rem, 8vw, 4.2rem); line-height: 1; }
.english-object { font-size: clamp(2.6rem, 8vw, 4rem); line-height: 1; }
.english-quantity {
  max-width: 100%;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  justify-items: center;
  gap: 3px;
  font-size: clamp(1.15rem, 3.8vw, 1.8rem);
  line-height: 1;
}

.word-bank {
  width: min(680px, 100%);
  margin: 0 auto;
  padding: clamp(9px, 1.6vw, 14px);
  border: 2px solid rgba(11, 91, 95, .25);
  border-radius: 18px;
  background: rgba(213, 247, 247, .58);
}
.word-bank-title { margin: 0 0 8px; color: var(--teal-dark); font-size: clamp(.88rem, 2vw, 1rem); font-weight: 900; text-align: center; }
.word-card-list { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(8px, 1.5vw, 12px); }
.word-card {
  position: relative;
  min-height: 50px;
  min-width: min(132px, 42vw);
  padding: 8px 16px;
  border: 2px solid var(--teal);
  border-radius: 14px;
  background: #fff;
  color: var(--teal-dark);
  font-size: clamp(1rem, 2.7vw, 1.3rem);
  font-weight: 900;
  line-height: 1.1;
  cursor: grab;
  touch-action: none;
  box-shadow: 0 4px 0 rgba(11, 91, 95, .26);
}
.word-card:active { cursor: grabbing; transform: translateY(2px); box-shadow: 0 2px 0 rgba(11, 91, 95, .26); }
.word-card.selected { border-color: var(--coral); background: var(--coral); color: #fff; box-shadow: 0 4px 0 #c94b3f; }
.word-card:focus-visible, .answer-drop-zone:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.word-selected-indicator { display: none; margin-left: 6px; }
.word-card.selected .word-selected-indicator { display: inline; }
.word-card.dragging { position: fixed; z-index: 20; pointer-events: none; opacity: .92; }
.match-rows { width: min(680px, 100%); margin: 0 auto; display: grid; gap: clamp(9px, 1.5vh, 14px); }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(10px, 2vw, 20px); }
.visual-cell, .answer-drop-zone {
  min-height: clamp(70px, 11vh, 96px);
  padding: clamp(8px, 1.5vw, 14px);
  display: grid;
  place-items: center;
  border-radius: 16px;
  box-sizing: border-box;
}
.visual-cell { border: 2px solid var(--teal); background: var(--sky); color: var(--teal-dark); }
.answer-drop-zone { border: 3px dashed rgba(11, 91, 95, .58); background: rgba(255,255,255,.75); color: var(--teal-dark); font-size: clamp(.95rem, 2.5vw, 1.2rem); font-weight: 900; text-align: center; cursor: pointer; }
.answer-drop-zone.drag-over { border-style: solid; border-color: var(--teal); background: var(--cream); box-shadow: 0 0 0 3px rgba(11, 91, 95, .14); transform: scale(1.02); }
.answer-drop-zone.completed { border-style: solid; border-color: #159468; background: #e8fbef; color: #0e704e; }
.drop-prompt { color: rgba(11, 91, 95, .68); font-size: clamp(.85rem, 2vw, 1rem); }
.drop-check { margin-left: 8px; display: inline-grid; width: 24px; height: 24px; place-items: center; border-radius: 50%; background: #159468; color: #fff; }

.finish-screen { flex: 0 0 auto; align-items: center; justify-content: center; gap: clamp(8px, 1.6vh, 16px); padding-bottom: clamp(14px, 3vh, 28px); text-align: center; }
.finish-bibo {
  width: min(220px, 56vw);
  max-height: min(260px, 38vh);
  padding: 0;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}
.finish-bibo-image { width: 100%; max-height: min(260px, 38vh); object-fit: contain; filter: drop-shadow(0 8px 6px rgba(34,72,45,.2)); }
.finish-bibo:focus-visible { outline: 4px solid var(--sun); outline-offset: 4px; }
.finish-copy { width: min(520px, 100%); padding: clamp(12px, 2vw, 18px); border: 2px solid rgba(255,202,75,.7); border-radius: 22px; background: var(--cream); color: var(--teal-dark); font-size: clamp(1.05rem, 3.2vw, 1.35rem); font-weight: 900; line-height: 1.4; }
.finish-copy p { margin: 0; }
.finish-copy p + p { margin-top: 6px; }
.finish-screen .primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
.finish-screen .primary:active { transform: translateY(2px) scale(.98); }
.bibo-wave .finish-bibo-image { animation: bibo-wave .5s ease-in-out; }
@keyframes bibo-wave { 0%, 100% { transform: rotate(0) scale(1); } 35% { transform: rotate(-7deg) scale(1.04); } 70% { transform: rotate(7deg) scale(1.04); } }

.lesson-subbar {
  min-height: 28px;
  margin: 5px clamp(12px, 3vw, 24px) 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lesson-subbar.has-audio { justify-content: space-between; }
.lesson-progress {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  align-items: center;
  gap: clamp(7px, 1vw, 9px);
}
.progress-dot {
  width: clamp(14px, 1.35vw, 16px);
  height: clamp(14px, 1.35vw, 16px);
  flex: 0 0 auto;
  border-radius: 50%;
  background: #b9d6d8;
  box-shadow: inset 0 0 0 1px rgba(11, 91, 95, .15);
}
.progress-dot.completed { background: var(--teal); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
.progress-dot.current { background: var(--coral); box-shadow: 0 0 0 3px rgba(255, 107, 90, .16); }

.screen:not(.story):not(.result) .instruction-only { margin-bottom: 8px; padding-top: 10px; padding-bottom: 10px; }
.screen:not(.story):not(.result) .feedback { min-height: 40px; padding-top: 6px; padding-bottom: 6px; }
.screen:not(.story):not(.result) .answers { gap: 8px; }
.screen:not(.story):not(.result) .actions { padding-top: 10px; }

/* The drag activities need a compact ten-frame wrapper.  The slots keep their
   own dimensions; only the dashed outer zone stops stretching to the old
   activity height. */
.screen:not(.story):not(.result) .play-area {
  flex: 0 0 auto;
  min-height: 0;
  align-items: start;
}

function lessonProgress() {

  const currentScreen = state.lesson.currentScreen || state.screen;
  return `<ol class="lesson-progress" aria-label="${state.lang === 'en' ? 'Lesson progress' : 'Tiến trình bài học'}">${steps.map(([screenId, labelKey], index) => {

  const soundLabel = state.screen === 'english-review' ? (state.soundOn ? t('englishAudioOn') : t('englishAudioOff')) : (state.soundOn ? t('soundOn') : t('soundOff'));
  const soundControl = state.lang === 'en' || state.screen === 'english-review' ? `<div class="sound-row"><button class="sound-toggle" id="soundToggle" type="button" aria-label="${soundLabel}" title="${soundLabel}" aria-pressed="${state.soundOn}">${state.soundOn ? '🔊' : '🔇'}</button></div>` : '';

    if (state.lang === button.dataset.lang) return;
    Audio.stop(); state.evidence.langChanges.push(button.dataset.lang); state.suppressAutoAudio = false;

function renderCurrentScreen(announceInstruction = false) {
  if (state.screen === 'story') return enterStory({ announceStory: announceInstruction });
  if (state.screen === 'basic-count') return enterBasicCount({ announceInstruction });
  if (state.screen === 'create-group') return renderCreateGroup({ announceInstruction });
  if (state.screen === 'select-fish') return enterSelectFish({ announceInstruction });
  if (state.screen === 'english-review') return enterEnglishReview({ announceInstruction });
  if (state.screen === 'finish') return enterFinish({ announce: announceInstruction });
  if (state.screen === 'reflection') return renderReflection();
  return startRound();
}

function goBack() {
  Audio.stop();
  if (state.screen === 'english-review') { state.screen = 'select-fish'; state.lesson.currentScreen = 'select-fish'; renderSelectFish(); return; }
  if (state.screen === 'select-fish') { state.screen = 'create-group'; state.lesson.currentScreen = 'create-group'; renderCreateGroup(); return; }
  if (state.screen === 'create-group') { state.screen = 'basic-count'; state.lesson.currentScreen = 'basic-count'; enterBasicCount({ announceInstruction: true }); return; }
  if (state.screen === 'reflection') { state.round = rounds.length - 1; startRound(); return; }
  if (state.screen === 'round' && state.round > 0) { state.round -= 1; startRound(); return; }
  enterStory({ announceStory: true });
}

function chooseTotal(round) {
  if (round.min === round.max) return round.min;
  const available = [];
  const lastCompletedTotal = state.completedTotals[state.completedTotals.length - 1];
  for (let n = round.min; n <= round.max; n++) if (n !== lastCompletedTotal) available.push(n);
  return available[Math.floor(Math.random() * available.length)];
}
function roundInstruction(round) {
  if (state.round === 0) return t('firstInstruction');
  if (state.round === 1) return t('nextInstruction', { item: item(round) });
  return t('finalInstruction');
}

function startRound() {
  if (state.round === 1 && state.screen !== 'create-group') { state.screen = 'create-group'; state.lesson.currentScreen = 'create-group'; return renderCreateGroup({ announceInstruction: true }); }
  state.screen = 'round';
  const round = rounds[state.round];
  state.total = chooseTotal(round); state.placed = 0; state.wrong = 0; state.drag = null;
  if (round.mode === 'tap') { renderFishRound(round); return; }
  const objects = Array.from({length: state.total}, (_, i) => `<div class="object" role="button" tabindex="0" aria-label="${item(round)} ${i+1}" data-id="${i}">${round.emoji}</div>`).join('');
  const slots = Array.from({length: 10}, (_, i) => `<div class="slot" data-slot="${i}" aria-label="${i+1}"></div>`).join('');
  shell(`<section class="screen">
    <div class="instruction-only">${roundInstruction(round)}</div>
    <div class="play-area">
      <section class="object-bank" aria-label="${t('biboThings')}"><div class="objects" id="objects">${objects}</div></section>
      <section class="zone"><p class="zone-title">${t('tenFrame')}</p><div class="ten-frame" id="frame">${slots}</div></section>
    </div>
    <div class="feedback" id="feedback"></div><div id="answers"></div>
    <div class="actions"><button class="secondary" id="reset">${t('reset')}</button></div>
  </section>`, Math.min(state.round + 1, 3));
  document.querySelectorAll('.object').forEach(bindObject);
  document.querySelector('#reset').addEventListener('click', resetCurrentRound);
  Audio.play('touch_instruction');
}

function renderFishRound(round) {
  const fish = Array.from({length: state.total}, (_, i) => `<button class="fish ${i % 2 ? 'fish-reverse' : ''}" type="button" aria-label="${item(round)} ${i + 1}" aria-pressed="false" data-id="${i}" style="--fish-delay: -${(i % 5) * .32}s; --fish-speed: ${2.1 + (i % 4) * .25}s"><span class="fish-icon" aria-hidden="true">${round.emoji}</span><span class="fish-tick" aria-hidden="true">✓</span></button>`).join('');
  shell(`<section class="screen fish-screen">
    <div class="instruction-only">${roundInstruction(round)}</div>
    <section class="aquarium" aria-label="${t('fishTank')}"><div class="fish-school">${fish}</div></section>
    <div class="feedback" id="feedback" aria-live="polite"></div><div id="answers"></div>
    <div class="actions"><button class="secondary" id="reset">${t('resetFish')}</button></div>
  </section>`, 3);
  document.querySelectorAll('.fish').forEach(fishButton => fishButton.addEventListener('click', countFish));
  document.querySelector('#reset').addEventListener('click', resetFishRound);
  Audio.play('touch_instruction');
}

function countFish(e) {
  const fish = e.currentTarget;
  if (fish.classList.contains('counted')) return;
  fish.classList.add('counted');
  fish.setAttribute('aria-pressed', 'true');
  fish.setAttribute('aria-label', `${fish.getAttribute('aria-label')} — ${t('fishCounted')}`);
  state.placed += 1;
  const feedback = document.querySelector('#feedback');
  feedback.className = 'feedback count-display';
  feedback.textContent = countWords[state.lang][state.placed];
  Audio.play('count', state.placed);
  if (state.placed === state.total) showAnswers();
}

function resetFishRound() {
  Audio.stop(); state.evidence.activities.concrete.resets += 1;
  state.placed = 0; state.wrong = 0;
  document.querySelectorAll('.fish').forEach((fish, i) => {
    fish.classList.remove('counted');
    fish.setAttribute('aria-pressed', 'false');
    fish.setAttribute('aria-label', `${item()} ${i + 1}`);
  });
  document.querySelector('#answers').innerHTML = '';
  const feedback = document.querySelector('#feedback');
  feedback.className = 'feedback'; feedback.textContent = '';
  Audio.play('touch_instruction');
}

function bindObject(el) {
  el.addEventListener('pointerdown', beginDrag);
  el.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && !el.classList.contains('placed')) {
      e.preventDefault(); const slot = [...document.querySelectorAll('.slot')].find(s => !s.classList.contains('filled'));
      if (slot) placeObject(el, slot);
    }
  });
}
function beginDrag(e) {
  const el = e.currentTarget; if (el.classList.contains('placed')) return;
  e.preventDefault(); const rect = el.getBoundingClientRect();
  state.drag = { el, home: el.parentElement, next: el.nextSibling, offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top };
  el.style.width = `${rect.width}px`; el.style.height = `${rect.height}px`; el.classList.add('dragging'); moveDrag(e);
  el.setPointerCapture?.(e.pointerId); el.addEventListener('pointermove', moveDrag);
  el.addEventListener('pointerup', endDrag, {once: true}); el.addEventListener('pointercancel', endDrag, {once: true});
}
function moveDrag(e) {
  if (!state.drag) return;
  const {el, offsetX, offsetY} = state.drag;
  el.style.left = `${e.clientX - offsetX}px`; el.style.top = `${e.clientY - offsetY}px`;
  document.querySelectorAll('.slot').forEach(slot => slot.classList.remove('target'));
  const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('.slot');
  if (under && !under.classList.contains('filled')) under.classList.add('target');
}
function endDrag(e) {
  if (!state.drag) return;
  const {el, home, next} = state.drag; el.removeEventListener('pointermove', moveDrag);
  const slot = document.elementFromPoint(e.clientX, e.clientY)?.closest('.slot');
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('target'));
  el.classList.remove('dragging'); el.removeAttribute('style'); state.drag = null;
  if (slot && !slot.classList.contains('filled')) placeObject(el, slot);
  else {
    if (next) home.insertBefore(el, next); else home.appendChild(el);
    const feedback = document.querySelector('#feedback'); const message = slot ? t('slotFull') : t('dropEmpty');
    feedback.textContent = message; feedback.className = 'feedback error'; Audio.play('try_again', message);
  }
}
function placeObject(el, slot) {
  state.placed += 1; el.classList.add('placed'); el.setAttribute('aria-disabled', 'true');
  slot.classList.add('filled'); slot.appendChild(el);
  const feedback = document.querySelector('#feedback'); feedback.className = 'feedback';
  feedback.textContent = countWords[state.lang][state.placed];
  feedback.classList.add('count-display');
  Audio.play('count', state.placed);
  if (state.placed === state.total) showAnswers();
}
function answerOptions(total) {
  const set = new Set([total]);
  for (const n of [total - 1, total + 1, total - 2, total + 2]) { if (n >= 1 && n <= 10) set.add(n); if (set.size === 3) break; }
  return [...set].sort(() => Math.random() - .5);
}
function showAnswers() {
  const feedback = document.querySelector('#feedback'); feedback.className = 'feedback'; feedback.textContent = t('lastNumber');
  document.querySelector('#answers').innerHTML = `<div class="answers">${answerOptions(state.total).map(n => `<button class="answer-btn" data-answer="${n}">${n}</button>`).join('')}</div>`;
  document.querySelectorAll('.answer-btn').forEach(btn => btn.addEventListener('click', checkAnswer));
}
function checkAnswer(e) {
  const answer = Number(e.currentTarget.dataset.answer); const feedback = document.querySelector('#feedback');
  if (answer !== state.total) {
    state.wrong += 1;
    state.evidence.activities.symbolic.wrongChoices += 1;
    state.evidence.activities.symbolic.hintsUsed += 1;
    state.evidence.activities.symbolic.hintTypes.push(state.wrong === 1 ? 'verbal' : 'visual');
    state.evidence.activities.symbolic.highestSupport = Math.max(state.evidence.activities.symbolic.highestSupport, state.wrong === 1 ? 1 : 2);
    const message = state.round === 2
      ? (state.wrong === 1 ? t('fishMismatch') : t('retryFishHint'))
      : (state.wrong === 1 ? t('mismatch') : t('retryHint'));
    feedback.textContent = message;
    feedback.className = 'feedback error shake';
    Audio.play('try_again', message); setTimeout(() => feedback.classList.remove('shake'), 350); return;
  }
  state.completedTotals.push(state.total); feedback.className = 'feedback';

  shell(`<section class="screen fish-screen" data-screen-id="select-fish"><div class="instruction-only">${t('fishInstruction', { target: selection.targetQuantity })}</div><section class="aquarium" aria-label="${t('fishTank')}"><div class="fish-school">${fish}</div></section><div class="feedback" id="fish-feedback">${fishFeedback(selection)}</div><div class="actions">${action}</div></section>`, 3);

function toggleFish(id) {
  const selection = state.lesson.selectFish;
  if (selection.completed || !selection.fishIds.includes(id)) return;
  const added = !selection.selectedFishIds.includes(id);
  selection.selectedFishIds = added ? [...new Set([...selection.selectedFishIds, id])] : selection.selectedFishIds.filter(value => value !== id);
  selection.selectionToggles += 1; renderSelectFish();
  if (added) Audio.play('count', spokenCountWords.en[selection.selectedFishIds.length]);
}
function checkFishSelection() {
  const selection = state.lesson.selectFish, correct = selection.selectedFishIds.length === selection.targetQuantity;
  state.evidence.events.push({ screenId: 'select-fish', totalFish: 10, targetQuantity: selection.targetQuantity, selectedFishIds: [...selection.selectedFishIds], submittedQuantity: selection.selectedFishIds.length, correct, retryCount: selection.retryCount, hintLevel: selection.hintLevel, selectionToggles: selection.selectionToggles });
  if (correct) { selection.completed = true; selection.feedbackKey = 'correct'; if (!state.lesson.completedScreens.includes('select-fish')) state.lesson.completedScreens.push('select-fish'); state.evidence.supportLevel = selection.retryCount === 0 ? 'independent' : selection.retryCount === 1 ? 'light_support' : 'guided'; }
  else { selection.retryCount += 1; selection.hintLevel = Math.min(3, selection.retryCount); selection.feedbackKey = selection.retryCount === 1 ? 'fishHint1' : selection.retryCount === 2 ? 'fishHint2' : 'fishHint3'; }
  renderSelectFish(); Audio.play(correct ? 'correct_feedback' : 'try_again', fishFeedback(selection));
}
function checkCreateGroup() {

      <p id="reflectFeedback" aria-live="polite"></p></div>
  </section>`, 3);
  Audio.play('reflect_instruction');
  document.querySelectorAll('.reflection').forEach(btn => btn.addEventListener('click', e => {
    const right = e.currentTarget.dataset.right === 'true'; const box = document.querySelector('#reflectFeedback');
    if (!right) { box.textContent = t('thinkAgain'); Audio.play('try_again', t('thinkAgain')); return; }
    document.querySelector('.result-card > p[data-spoken]')?.remove();
    document.querySelector('.result-card .answers').remove();
    box.className = 'completion-message';
    box.innerHTML = `<span class="correct-praise">${t('correctPraise')}</span><span>${t('correctConserve')}</span><span class="bibo-line">${t('thanks')}</span><span>${t('seeYou')}</span>`;
    Audio.play('lesson_ending');
    document.querySelector('.result-card').insertAdjacentHTML('beforeend', `<div class="actions"><button class="secondary" id="again">${t('again')}</button></div>`);
    document.querySelector('#again').addEventListener('click', startExperimentalReplay);
  }));
}

renderStory();

</script>

<script id="candidate-visible-area-script">
(() => {
  let frame;
  const fitVisibleArea = () => {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      const viewport = window.visualViewport;
      if (viewport && Math.abs(viewport.scale - 1) > .01) return;
      const height = Math.round(Math.min(innerHeight, viewport?.height || innerHeight));
      document.documentElement.style.setProperty('--candidate-visible-height', height + 'px');
      document.documentElement.classList.toggle('candidate-short-landscape', innerWidth >= 600 && height <= 340);
    });
  };
  window.addEventListener('resize', fitVisibleArea);
  window.addEventListener('orientationchange', fitVisibleArea);
  window.visualViewport?.addEventListener('resize', fitVisibleArea);
  fitVisibleArea();
})();
</script>
