  function createGroupIsExact(s){ return s.placedIds.length === s.target; }
  function renderCreateGroup(){ initCreateGroup(); const s=state.lesson.createGroup; const placed=s.placedIds; const source=s.items.filter(id=>!placed.includes(id)); const exact=createGroupIsExact(s); const slots=Array.from({length:5},(_,i)=>`<div class="slot" data-slot="${i}">${placed[i]?itemButton(placed[i],s.objectVariant,s.completed):''}</div>`).join(''); const overflow=placed.slice(5).map(id=>itemButton(id,s.objectVariant,s.completed)).join(''); return `<section class="screen"><p class="instruction">${t('create',{n:s.target,object:objectWord(s.objectVariant,s.target)})}</p><div class="work-layout"><div class="zone source-zone" data-zone="source" aria-label="${state.lang==='vi'?'Các món để lấy':'Items to choose'}"><div class="source-items">${source.map(id=>itemButton(id,s.objectVariant,s.completed)).join('')}</div></div><div class="zone" aria-label="${state.lang==='vi'?'Nhóm của con':'Your group'}"><div class="five-frame" data-zone="frame">${slots}</div><div class="overflow-zone" data-zone="frame">${overflow}</div><div class="group-count">${placed.length}</div></div></div>${feedback(s,!s.completed||exact)}${controls({check:!s.completed,next:s.completed&&exact})}</section>`; }
  function objectImage(variant){ return `<img class="learning-object" src="${variant.image}" alt="">`; }
  function itemButton(id, variant, disabled=false){ return `<button class="item group-item" data-item-id="${id}" draggable="false" ${disabled?'disabled':''} aria-label="${objectWord(variant,1)}">${objectImage(variant)}</button>`; }
  function feedback(s, valid=true){ return s.feedback && valid?`<p class="feedback ${s.completed?'good':'hint'}">${s.feedback}</p>`:'<p class="feedback" aria-live="polite"></p>'; }
  function numberSearchIsExact(s){ const matches=s.cards.filter(c=>c.value===s.target).map(c=>c.id); return matches.length===s.selectedCardIds.length&&matches.every(id=>s.selectedCardIds.includes(id)); }
  function renderNumberSearch(){ initNumberSearch(); const s=state.lesson.numberSearch; const exact=numberSearchIsExact(s); return `<section class="screen number-search-screen"><p class="instruction">${t('find',{n:s.target})}</p><div class="cards number-cards">${s.cards.map(c=>`<button class="card ${s.selectedCardIds.includes(c.id)?'selected':''}" style="--card-tilt:${c.tilt}" data-card-id="${c.id}" ${s.completed?'disabled':''} aria-pressed="${s.selectedCardIds.includes(c.id)}">${c.value}</button>`).join('')}</div>${feedback(s,!s.completed||exact)}${controls({check:!s.completed,next:s.completed&&exact})}</section>`; }
  function fixGroupSize(s){ return s.objects.filter(object=>object.location==='bibo').length; }

  function render(){ const body=state.currentScreen==='story'?renderStory():state.currentScreen==='create-group'?renderCreateGroup():state.currentScreen==='number-search'?renderNumberSearch():state.currentScreen==='fix-group'?renderFixGroup():state.currentScreen==='english-review'?renderEnglishReview():renderFinish(); app.innerHTML=header()+dots()+body+backControl(); bind(); audio.status(audio.notice); }
  function instructionForScreen(){ const s=state.currentScreen; if(s==='story') return t('story'); if(s==='create-group'){ const activity=state.lesson.createGroup; return t('create',{n:activity.target,object:objectWord(activity.objectVariant,activity.target)}); } if(s==='number-search') return t('find',{n:state.lesson.numberSearch.target}); if(s==='fix-group'){ const activity=state.lesson.fixGroup; return `${t('fix')} ${activity.target}.`; } if(s==='english-review') return `Find ${words[state.lesson.englishReview.target]}.`; return t('finish'); }
  function go(screen, speak=true){ audio.cancel(); state.currentScreen=screen; render(); if(speak) audio.speak(`screen-${screen}`, instructionForScreen()); }
  function next(){ const index=screenOrder.indexOf(state.currentScreen); if(index===0){ onceComplete('story'); go('create-group'); } else if(index<screenOrder.length-1) go(screenOrder[index+1]); else { onceComplete('english-review'); go('finish'); } }
  function back(){ const index=screenOrder.indexOf(state.currentScreen); if(index>0) go(screenOrder[index-1],false); }
  function hint(attempts){ return attempts===1?t('countAgain'):attempts===2?t('countCarefully'):t('countOne'); }
  function fixGroupState(s){ const size=fixGroupSize(s); return size===s.target?'exact':size<s.target?'under':'over'; }
  function fixGroupEvidence(s){ const finalGroupSize=fixGroupSize(s); return {target:s.target,initialGroupSize:s.initialGroupSize,initialState:s.initialState,originalObjectIds:s.objects.filter(object=>object.origin==='initial').map(object=>object.id),addedObjectIds:s.objects.filter(object=>object.origin==='spare'&&object.location==='bibo').map(object=>object.id),removedObjectIds:s.objects.filter(object=>object.origin==='initial'&&object.location==='spare').map(object=>object.id),firstCheckGroupSize:s.firstCheckGroupSize,firstCheckCorrect:s.firstCheckCorrect,selfCorrection:s.childActions.length>0,finalGroupSize,attempts:s.attempts,hintsUsed:s.hintsUsed}; }  function check(){ const s=state.currentScreen==='create-group'?state.lesson.createGroup:state.currentScreen==='number-search'?state.lesson.numberSearch:state.currentScreen==='fix-group'?state.lesson.fixGroup:state.lesson.englishReview; if (!s || s.completed) return; let correct=false; if(state.currentScreen==='create-group') correct=s.placedIds.length===s.target; if(state.currentScreen==='number-search') correct=numberSearchIsExact(s); if(state.currentScreen==='fix-group'){ const currentGroupSize=fixGroupSize(s); correct=currentGroupSize===s.target; if(s.firstCheckGroupSize===null){ s.firstCheckGroupSize=currentGroupSize; s.firstCheckCorrect=correct; } } if(state.currentScreen==='english-review') correct=s.selected===s.target; const evidence=state.currentScreen==='create-group'?{target:s.target,objectVariant:s.objectVariant.id,selectedCount:s.placedIds.length,groupState:s.placedIds.length===s.target?'exact':s.placedIds.length>s.target?'over':'under',stopBehavior:s.actions.includes('remove')?'self_corrected_after_adding':s.placedIds.length>s.target?'continued_past_target':'stopped_at_or_before_target',childActions:[...s.actions]}:state.currentScreen==='number-search'?{targetNumber:s.target,targetCardCount:s.targetCardCount,selectedCardIds:[...s.selectedCardIds],distractorSelections:s.selectedCardIds.filter(id=>s.cards.find(c=>c.id===id)?.value!==s.target),omissionsAtCheck:s.cards.filter(c=>c.value===s.target&&!s.selectedCardIds.includes(c.id)).map(c=>c.id),deselections:s.deselections,selfCorrections:s.deselections>0}:state.currentScreen==='fix-group'?fixGroupEvidence(s):{target:s.target,selected:s.selected}; if(correct){ const event={...evidence,correct:true,attempt:s.attempts+1,hintsUsed:s.hintsUsed,supportLevel:s.attempts===0?'independent':s.attempts===1?'light_support':'guided',completion:true}; s.completed=true; s.feedback=state.currentScreen==='create-group'?t('createGood',{n:s.target,object:objectWord(s.objectVariant,s.target)}):state.currentScreen==='number-search'?t('cardGood',{n:s.target,count:s.targetCardCount}):state.currentScreen==='fix-group'?t('fixGood'):'Great!'; onceComplete(state.currentScreen); record(state.currentScreen,event); if(state.currentScreen==='create-group') state.evidence.c13.createGroup=event; if(state.currentScreen==='fix-group') state.evidence.c13.fixGroup=event; if(state.currentScreen==='number-search') state.evidence.supporting.numberSearch=event; if(state.currentScreen==='english-review') state.evidence.englishExposure.push(event); render(); audio.speak('correct',s.feedback); } else { s.attempts+=1; s.hintsUsed+=1; s.feedback=state.currentScreen==='number-search'?t('lookAgain'):state.currentScreen==='fix-group'?(s.attempts===1?t('lookAgain'):t('countAgain')):hint(s.attempts); const event={...evidence,correct:false,attempt:s.attempts,hintsUsed:s.hintsUsed,supportLevel:s.attempts===1?'light_support':'guided',completion:false}; record(state.currentScreen,event); render(); audio.speak('hint',s.feedback); } }  function moveItem(id,toFrame){ const s=state.lesson.createGroup; if (!s || s.completed) return; const placed=s.placedIds.includes(id); if(toFrame&&!placed){ s.placedIds.push(id); s.actions.push('add'); } if(!toFrame&&placed){ s.placedIds=s.placedIds.filter(x=>x!==id); s.actions.push('remove'); } render(); if(toFrame) audio.speak('count',words[s.placedIds.length]); }
  function moveFixObject(id,toLocation){ const s=state.lesson.fixGroup; if(!s||s.completed) return; const object=s.objects.find(candidate=>candidate.id===id); if(!object||object.location===toLocation) return; const from=object.location; object.location=toLocation; object.changedByChild=true; s.childActions.push({objectId:id,from,to:toLocation}); render(); }  function replay(){ audio.cancel(); const sound=state.soundOn, priorTargets=state.lesson.priorTargets; state.currentScreen='story'; state.completedScreens=[]; state.evidence={events:[],c13:{createGroup:null,fixGroup:null},supporting:{numberSearch:null},englishExposure:[]}; state.lesson={createGroup:null,numberSearch:null,fixGroup:null,englishReview:null,priorTargets}; state.lang='en'; state.soundOn=sound; render(); }
  function bind(){ document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{ const changed=state.lang!==button.dataset.lang; audio.cancel(); state.lang=button.dataset.lang; render(); if(changed&&state.lang==='en'&&state.soundOn) audio.speak('language',instructionForScreen()); })); document.querySelector('#story-audio')?.addEventListener('click',()=>audio.speak('story-button',t('story'))); const sound=document.querySelector('#sound-toggle'); sound?.addEventListener('click',()=>{ state.soundOn=!state.soundOn; audio.cancel(); render(); if(state.soundOn) audio.speak('user-instruction',instructionForScreen()); }); document.querySelector('#next')?.addEventListener('click',next); document.querySelector('#back')?.addEventListener('click',back); document.querySelector('#check')?.addEventListener('click',check); document.querySelector('#replay')?.addEventListener('click',replay); document.querySelector('#finish-bibo')?.addEventListener('click',()=>audio.speak('thanks',t('finish')));
    document.querySelectorAll('.group-item').forEach(el=>{ let dragged=false,start=null; el.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};dragged=false; el.setPointerCapture?.(e.pointerId);}); el.addEventListener('pointermove',e=>{if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>=6)dragged=true;}); el.addEventListener('pointerup',e=>{if(!dragged)return; const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-zone]'); if(target) moveItem(el.dataset.itemId,target.dataset.zone==='frame'); start=null; setTimeout(()=>dragged=false,0);}); el.addEventListener('pointercancel',()=>{start=null;dragged=false;}); el.addEventListener('lostpointercapture',()=>{start=null;dragged=false;}); el.addEventListener('click',()=>{if(!dragged){const inFrame=state.lesson.createGroup.placedIds.includes(el.dataset.itemId);moveItem(el.dataset.itemId,!inFrame);}}); el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const inFrame=state.lesson.createGroup.placedIds.includes(el.dataset.itemId);moveItem(el.dataset.itemId,!inFrame);}}); });
    document.querySelectorAll('[data-card-id]').forEach(el=>el.addEventListener('click',()=>{const s=state.lesson.numberSearch;if(s.completed) return; const id=el.dataset.cardId;const selected=s.selectedCardIds.includes(id);s.selectedCardIds=selected?s.selectedCardIds.filter(x=>x!==id):[...s.selectedCardIds,id];if(selected) s.deselections+=1;render();})); document.querySelectorAll('[data-fix-object-id]').forEach(el=>{let start=null,dragged=false,suppressClick=false; const clear=()=>{start=null;dragged=false;}; el.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};dragged=false;el.setPointerCapture?.(e.pointerId);});el.addEventListener('pointermove',e=>{if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>=6)dragged=true;});el.addEventListener('pointerup',e=>{if(!dragged)return;const zone=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-fix-zone]');if(zone) moveFixObject(el.dataset.fixObjectId,zone.dataset.fixZone);suppressClick=true;clear();setTimeout(()=>suppressClick=false,0);});el.addEventListener('pointercancel',clear);el.addEventListener('lostpointercapture',clear);el.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return;}moveFixObject(el.dataset.fixObjectId,el.dataset.fixOrigin==='bibo'?'spare':'bibo');});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();moveFixObject(el.dataset.fixObjectId,el.dataset.fixOrigin==='bibo'?'spare':'bibo');}});}); document.querySelectorAll('[data-mini]').forEach(el=>el.addEventListener('click',()=>{const s=state.lesson.englishReview;if(s.completed) return; s.selected=Number(el.dataset.mini);render();audio.speak('mini',words[s.selected]);})); }
  render();
})();

<script>
(() => {
  const copy = {
    vi: { label: 'Cùng ba mẹ khám phá', body: 'Lấy 5 vật thật. Con hãy tạo một nhóm có đúng 5 vật.', note: 'Hoạt động 2–5 phút · Không cần chấm điểm', icons: '🧸 🧱 🍎 🥄 🖍️' },
    en: { label: 'Explore with an adult', body: 'Find 5 real objects. Make one group with exactly 5 objects.', note: '2–5 minutes · No score needed', icons: '🧸 🧱 🍎 🥄 🖍️' }
  };
  const style = document.createElement('style');
  style.textContent = `.real-world-practice{width:min(92%,560px);margin:8px auto 2px;padding:12px 16px;border:2px solid #ffc738;border-radius:18px;background:#fff9e8;text-align:center;color:#074f59;box-shadow:0 3px 0 #ffc73833}.real-world-practice__label{margin:0 0 4px;font-size:clamp(18px,3vw,22px);font-weight:800}.real-world-practice__icons{margin:3px 0;font-size:clamp(20px,4vw,28px);letter-spacing:4px}.real-world-practice__body{margin:4px 0;font-size:clamp(16px,2.5vw,20px);font-weight:700;line-height:1.28}.real-world-practice__note{margin:4px 0 0;color:#536f70;font-size:clamp(13px,2vw,16px)}.finish--with-practice{gap:5px!important}.finish.finish--with-practice .bibo{max-height:170px}@media(max-width:600px){.finish .real-world-practice{padding:9px 12px;margin-top:2px}.real-world-practice__icons{font-size:20px}.real-world-practice__body{font-size:16px}.real-world-practice__note{font-size:13px}.finish.finish--with-practice .bibo{max-height:130px}}`;
  document.head.append(style);
  const addPractice = () => {
    const finish = document.querySelector('.finish');
    if (!finish || finish.querySelector('.real-world-practice')) return;
    finish.classList.add('finish--with-practice');
    const lang = document.documentElement.lang === 'vi' ? 'vi' : 'en';
    const c = copy[lang];
    const card = document.createElement('section');
    card.className = 'real-world-practice';
    card.setAttribute('aria-label', c.label);
    card.innerHTML = `<p class="real-world-practice__label">${c.label}</p><div class="real-world-practice__icons" aria-hidden="true">${c.icons}</div><p class="real-world-practice__body">${c.body}</p><p class="real-world-practice__note">${c.note}</p>`;
    const actions = finish.querySelector('.actions');
    finish.insertBefore(card, actions || null);
  };
  new MutationObserver(addPractice).observe(document.querySelector('#app'), { childList:true, subtree:true });
  addPractice();
})();
</script>
