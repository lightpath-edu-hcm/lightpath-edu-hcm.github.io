<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="b25-build" content="spatial-placement-v2">
<title>Light Path B25 – Pieces and Shapes</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8faf7;color:#083f4a;font-family:"Times New Roman",serif}button{font:700 inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
#app{width:min(100%,1050px);height:100dvh;margin:auto;background:#fff;overflow:hidden}
:root{--bh:clamp(50px,13vh,88px)}
.head{height:68px;background:#0d8178;color:#fff;display:grid;grid-template-columns:70px 1fr 145px;align-items:center;padding:5px 10px}.logo{width:54px;height:54px;object-fit:contain}.title{text-align:center;font-size:28px;font-weight:700;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere;min-width:0}.tools{display:flex;gap:4px;justify-content:flex-end}.tools button{border:0;border-radius:24px;height:43px;min-width:42px;font-size:18px;color:#075a55;background:#d7efec}.tools .on{background:#fff}
.dots{height:22px;text-align:center}.dots i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#d5e5e4;margin:5px}.dots i.on{background:#ff7167}
.main{height:calc(100dvh - 90px);display:flex;flex-direction:column;padding:0 14px 8px;position:relative}
.prompt{align-self:center;max-width:96%;background:#dff6f3;border-radius:22px;padding:6px 18px;font-size:25px;font-weight:700;text-align:center;line-height:1.08}.prompt small{display:block;font-size:.8em;margin-top:2px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0}
.work{width:min(900px,100%);height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.feedback{min-height:28px;text-align:center;font-size:21px;font-weight:700;color:#9b322b}.feedback.ok{color:#1b6b3a}.feedback.hint{color:#0b5c8a}.hlc{outline:4px dashed #d48a00;background:#ffe08a;transform:scale(1.08)}
.actions{min-height:60px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:4px 62px}
.btn,.choice{border:3px solid #0d8178;border-radius:16px;background:#fff;padding:7px 17px;color:#073f4b;box-shadow:0 4px #087068;font-size:22px;min-height:46px}
.check{background:#f7bd35;border-color:#d48a00;box-shadow:0 4px #b87500}.primary{background:#ff7167;color:#fff;border-color:#d84f46;box-shadow:0 4px #b63e36}
.btn:disabled{opacity:.5;box-shadow:none}.choice:disabled{opacity:.55}
.choice.sel{background:#ffe08a;outline:3px solid #d48a00}
.back{position:absolute;right:12px;bottom:10px;width:48px;height:48px;border:0;border-radius:50%;background:#0d8178;color:#fff;font-size:25px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{min-width:64px;min-height:52px;font-size:30px;padding:4px 14px}.dc{touch-action:none;user-select:none}
.ghost{position:fixed;pointer-events:none;z-index:9;opacity:.9}
.track{position:relative;width:100%;padding-top:var(--bh);background:#dff6f3;border:4px solid #70bcb4;border-radius:22px;padding-bottom:4px}
.ab{position:absolute;top:0;height:var(--bh);transform:translateX(-50%);transition:left .5s;font-size:calc(var(--bh)*.7);line-height:1;display:flex;align-items:flex-end}.ab img{height:100%;width:auto;display:block}
.stones{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:1px;padding:0}
.stone{height:clamp(66px,11vh,98px);border-radius:14px;border:3px solid #bd7c36;background:#fff8dd;box-shadow:0 3px #7a4a20;color:#0d8178;font-weight:700;font-size:clamp(14px,4.2vw,26px);padding:5px 0 2px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px}
.stone em{font-style:normal;font-size:clamp(8px,2.3vw,13px);font-weight:700;line-height:1.05;color:#087068;overflow-wrap:anywhere;text-align:center}
.stone.hl,.slot.hl{background:#ffe08a;outline:3px solid #d48a00}.stone.st{border-color:#ff7167}
.na{background:#ff7167;color:#fff;border-radius:50%;width:calc(var(--bh)*.6);height:calc(var(--bh)*.6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--bh)*.25);align-self:flex-end}
.seq{display:flex;gap:12px;justify-content:center}.slot{width:clamp(58px,18vw,96px);height:clamp(58px,18vw,96px);border:4px solid #70bcb4;border-radius:17px;background:#fff;display:grid;place-items:center;font-size:clamp(24px,6vw,40px);font-weight:700}.slot.blank{border-style:dashed}
.stairs{width:min(560px,100%);display:flex;flex-direction:column;gap:2px;min-height:0;flex:1;padding:6px;background:#f3fbfa;border:4px solid #70bcb4;border-radius:22px}
.fl{flex:1;min-height:0;display:flex;align-items:center;gap:6px}.bar{height:100%;background:#fff8dd;border:2px solid #bd7c36;border-radius:8px;display:flex;align-items:center;padding-left:8px;font-weight:700;color:#0d8178;font-size:clamp(11px,3vh,22px)}
.fl img{height:98%;width:auto}.fl i{font-style:normal;font-size:clamp(10px,2.6vh,16px);font-weight:700;color:#087068}
.reflect{display:grid;grid-template-columns:minmax(0,38fr) minmax(0,62fr);align-items:center;width:95%;height:100%;gap:10px}.reflect img{max-width:100%;max-height:100%;object-fit:contain}.reflectText{min-width:0;max-width:100%;background:#dff6f3;border-radius:20px;padding:16px;font-size:22px;line-height:1.25;overflow-wrap:anywhere}.reflectText ul{margin:6px 0;padding-left:20px}
.inlineAudio{flex:none;width:34px;height:34px;margin-left:6px;padding:0;border:0;border-radius:50%;background:#fff;font-size:19px;vertical-align:middle}.m1w{width:100%;--bh:clamp(70px,17vh,116px)}
.introBibo{height:min(52vh,430px);width:100%;display:flex;align-items:center;justify-content:center}.introBibo img{max-height:100%;max-width:72%;object-fit:contain}
.flg svg{height:88%;width:auto;display:block}
.choice.dim{opacity:.55}.stepbtn{min-width:140px}
.hop img{animation:hop .35s}@keyframes hop{50%{transform:translateY(-14px)}}
@media(max-width:700px){.head{height:62px;grid-template-columns:58px 1fr 122px;padding:3px 6px}.logo{width:46px;height:46px}.title{font-size:clamp(12px,3.5vw,18px)}.tools button{height:38px;min-width:37px;padding:0;font-size:16px}.main{height:calc(100dvh - 84px);padding:0 2px 5px}.prompt{font-size:18px;padding:5px 9px}.actions{padding:3px 56px 3px 4px;min-height:54px}.btn,.choice{font-size:17px;padding:6px 10px}.card{font-size:26px}.feedback{font-size:16px;min-height:23px;padding:0 6px}.work{gap:8px}.reflect{grid-template-columns:minmax(0,34fr) minmax(0,66fr);width:100%}.reflectText{font-size:16px;padding:9px}}
@media(max-height:700px){.head{height:56px}.dots{height:18px}.main{height:calc(100dvh - 74px)}.prompt{font-size:17px;padding:4px 8px}.actions{min-height:48px}.reflectText{font-size:14px;line-height:1.15;padding:7px}}
.inlineAudio:disabled,.tools button:disabled{opacity:.5;cursor:default}

/* Lesson-local voice-status/header containment; original spatial/shape rules and evidence preserved. */
#app{display:flex;flex-direction:column}.main{height:auto;flex:1;min-height:0}.dots{flex-shrink:0}.head{height:auto;min-height:68px;flex-shrink:0}.lesson-home-slot{display:none}.audio-status{grid-column:1/-1;text-align:center;font-size:13px;line-height:1.2;overflow-wrap:anywhere}@media(max-width:700px){.head{min-height:62px}}@media(max-height:650px){.head{min-height:56px}}
</style></head><body><div id="app"></div>

function remainingCanCompleteS1(r,placed){const target=targetAtoms(s1Cells(r)),occ=occupiedAtoms(placed);if([...occ].some(a=>!target.has(a)))return false;let missing=[...target].filter(a=>!occ.has(a));if(!missing.length)return true;let remain=r.order.filter(p=>!placed.some(q=>q.id===p.id)&&p.type!=='CIR');let positions=[];for(let y=0;y<r.rows;y++)for(let x=0;x<r.cols;x++)positions.push([x,y]);function dfs(i,cur){let co=occupiedAtoms(cur);if([...target].every(a=>co.has(a)))return true;if(i>=remain.length)return false;for(let j=i;j<remain.length;j++){let q=remain[j];for(let [x,y] of positions){let vr=placementResult(q.type,x,y,cur,s1Cells(r));if(vr.ok&&dfs(j+1,[...cur,{...q,x,y}]))return true}}return false}return dfs(0,placed)}
function recordS1Fail(r,p,e,att,er,phys,fb){att.errorType=er;att.physicalResult=phys;e.attempts.push(att);e.retries++;if(e.errorType==='none')e.errorType=er;if(e.firstPieceFits===null)e.firstPieceFits=false;e.supportLevel=support(e.retries);r.fb=tt(fb);if(e.retries===2){e.hintUsed=true;e.systemSupport.push('piece-outline')}render()}
function s1SpatialPlace(id,x,y){let s=state(1),r=s.rounds[s.round],p=r.order.find(q=>q.id===id);if(!p||r.done)return;let e=r.e,vr=placementResult(p.type,x,y,r.placed,s1Cells(r)),att={chosenPiece:p.type,gridX:x,gridY:y,errorType:vr.errorType,physicalResult:vr.physicalResult};if(e.firstPieceChosen===null)e.firstPieceChosen=p.type;if(!vr.ok)return recordS1Fail(r,p,e,att,vr.errorType,vr.physicalResult,vr.physicalResult==='overflow'?'fbOver':vr.physicalResult==='overlap'?'fbOverlap':vr.errorType==='wrongShape'?'wrongShape':'fbGap');let proposed=[...r.placed,{...p,x,y}];if(!remainingCanCompleteS1(r,proposed)){att.errorType='deadEnd';e.attempts.push(att);e.retries++;if(e.firstPieceFits===null)e.firstPieceFits=false;if(e.errorType==='none')e.errorType='deadEnd';e.supportLevel=support(e.retries);r.fb=tt('fbTry');render();setTimeout(()=>{if(!r.done){r.fb='';render()}},800);return}r.placed=proposed;e.attempts.push(att);if(e.firstPieceFits===null)e.firstPieceFits=true;r.sel=null;r.fb='';let full=isCovered(r.placed,s1Cells(r)),types=r.placed.map(q=>q.type),requirements=s.round===0?(types.length===2&&types.every(t=>t==='SQ')):(types.length===2&&types.includes('TBL')&&types.includes('TTR'));if(full&&requirements){r.done=true;e.solutionSet=[...types];e.supportLevel=support(e.retries,e.systemSupport.length>1);r.fb=tt('ok')}render()}
function rS1Spatial(s){let r=s.rounds[s.round];if(r.e.retries>=2&&!r.e.systemSupport.includes('piece-outline')){r.e.hintUsed=true;r.e.systemSupport.push('piece-outline')}let u=58,tray=r.order.filter(p=>!r.placed.some(q=>q.id===p.id)).map(p=>pieceButton(p,r.sel===p.id,r.e.retries>=2&&r.need.includes(p.type))).join('');shell(tt('s1'),`<div class="phaseTag">${s.round+1}/2</div><div class="shapeStage"><div class="targetBox">${spatialGrid(s1Cells(r),r.placed,u)}</div><div class="tray">${tray}</div></div>`,r.done?`<button class="btn primary" data-act="nextRound">${tt('cont')}</button>`:'',{text:r.fb,ok:r.done})}
function s4Cells(){return[[0,0],[0,1],[1,1]]}
function signatureOf(ps){return ps.every(p=>p.type==='SQ')?'SSS':ps.some(p=>p.type==='RH'||p.type==='RV')&&ps.some(p=>p.type==='SQ')?'RS':'OTHER'}
function canCompleteL(placed){const target=targetAtoms(s4Cells()),occ=occupiedAtoms(placed);if([...occ].some(a=>!target.has(a)))return false;const candidates=[{type:'SQ'},{type:'RH'},{type:'RV'}];let pos=[[0,0],[0,1],[1,1]];function dfs(depth,cur){let co=occupiedAtoms(cur);if([...target].every(a=>co.has(a)))return true;if(depth>3)return false;for(let q of candidates)for(let [x,y] of pos){if(placementResult(q.type,x,y,cur,s4Cells()).ok&&dfs(depth+1,[...cur,{...q,x,y}]))return true}return false}return dfs(0,placed)}
function s4Fail(s,e,att,er,phys,fb){let ph=s.phase-1;s.tries[ph]++;e.retries++;e.attempts.push({...att,errorType:er,physicalResult:phys});s.fb=tt(fb);if(s.tries[ph]===2){e.hintUsed=true;e.systemSupport.push('needed-piece-highlighted')}if(s.tries[ph]>=3&&!e.systemSupport.includes('needed-piece-highlighted'))e.systemSupport.push('needed-piece-highlighted');render()}
function s4SpatialPlace(id,x,y){let s=state(4);if(s.phase>2)return;let types=['SQ','SQ','SQ','SQ','RH','RV','CIR'],type=types[+id.slice(2)],e=s.e,att={phase:s.phase,chosenPiece:type,gridX:x,gridY:y};let vr=placementResult(type,x,y,s.placed,s4Cells());if(!vr.ok)return s4Fail(s,e,att,vr.errorType,vr.physicalResult,vr.physicalResult==='overflow'?'fbOver':vr.physicalResult==='overlap'?'fbOverlap':vr.errorType==='wrongShape'?'wrongShape':'fbGap');let proposed=[...s.placed,{id,type,x,y}];if(!canCompleteL(proposed))return s4Fail(s,e,att,'deadEnd','fit','fbTry');s.placed=proposed;s.sel=null;e.attempts.push({...att,errorType:'none',physicalResult:'fit'});s.fb='';if(isCovered(s.placed,s4Cells())){let sg=signatureOf(s.placed);if(!['SSS','RS'].includes(sg))return s4Fail(s,e,att,'deadEnd','fit','fbTry');if(s.phase===1){s.solution1=clone(s.placed);s.sig1=sg;e.solution1=clone(s.solution1);e.solution1SupportLevel=support(s.tries[0]);s.phase=2;s.placed=[];s.fb=tt('step2')}else if(sg===s.sig1){s.tries[1]++;e.retries++;e.attempts.push({phase:2,composition:clone(s.placed),errorType:'sameSet',physicalResult:'fit'});s.placed=[];s.fb=tt('fbSame');e.solution2SupportLevel=support(s.tries[1])}else{s.solution2=clone(s.placed);s.sig2=sg;e.solution2=clone(s.solution2);e.solutionsDistinct=true;e.solution2SupportLevel=support(s.tries[1]);s.phase=3;s.placed=[];s.verify=shuffle([{id:'A',valid:true,sol:s.solution1},{id:'B',valid:true,sol:s.solution2},{id:'C',valid:false,sol:[{type:'SQ',x:0,y:0},{type:'SQ',x:0,y:1}]}])}}render()}
function rS4Spatial(s){if(s.phase===3)return rVerify(s);let types=['SQ','SQ','SQ','SQ','RH','RV','CIR'],used=new Set(s.placed.map(p=>p.id)),tray=types.map((x,i)=>({type:x,id:'s4'+i})).filter(p=>!used.has(p.id)).map(p=>pieceButton(p,s.sel===p.id,s.tries[s.phase-1]>=2&&((s.phase===1&&p.type==='SQ')||(s.phase===2&&s.sig1==='SSS'&&['RH','RV'].includes(p.type))||(s.phase===2&&s.sig1==='RS'&&p.type==='SQ')))).join('');shell(s.phase===1?tt('s4'):tt('step2'),`<div class="phaseTag">${s.phase}/3</div><div class="s4layout"><div class="targetBox">${spatialGrid(s4Cells(),s.placed,56,'lshape')}</div><div class="tray">${tray}</div></div>`,`<button class="btn" data-act="restart">${tt('restart')}</button>`,{text:s.fb,ok:false})}
function placeFromPoint(el,id,cx,cy){let type;if(S25.screen===1){let s=state(1),r=s.rounds[s.round],p=r.order.find(q=>q.id===id);if(!p)return;type=p.type}else if(S25.screen===4){type=['SQ','SQ','SQ','SQ','RH','RV','CIR'][+id.slice(2)]}else return;let u=+el.dataset.u||56,g=gridFromPoint(el,cx,cy,type,u);if(S25.screen===1)s1SpatialPlace(id,g.x,g.y);else s4SpatialPlace(id,g.x,g.y)}
function advance(){if(S25.screen<5){S25.screen++;render()}}function nextRound(){let s=state(S25.screen);if(s.round<s.rounds.length-1){s.round++;render()}else advance()}
let suppressPieceClickUntil=0;
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,id=b.dataset.id;if(a==='lang'){S25.lang=b.dataset.v;stop25();render()}else if(a==='audio'){if(S25.lang!=='en'||!hasSpeech25())return;S25.audio=!S25.audio;stop25();render();if(S25.audio)say25(instruction25())}else if(a==='listen'){say25(instruction25())}else if(a==='ready'||a==='next')advance();else if(a==='back'){S25.screen=Math.max(0,S25.screen-1);render()}else if(a==='again'){stop25();lastAudioScene='';lastAudioFeedback='';S25=fresh();render()}else if(a==='piece'){if(Date.now()<suppressPieceClickUntil)return;if(S25.screen===1){let r=state(1).rounds[state(1).round];r.sel=r.sel===id?null:id;render()}else if(S25.screen===4){let s=state(4);s.sel=s.sel===id?null:id;render()}}else if(a==='spatialTarget'){let id2=S25.screen===1?state(1).rounds[state(1).round].sel:state(4).sel;if(id2)placeFromPoint(b,id2,e.clientX,e.clientY)}else if(a==='line')chooseLine(id);else if(a==='regroup'){let s=state(2),r=s.rounds[s.round];r.e.regroupDone=true;r.e.regroupBy='child';nextRound()}else if(a==='cand')chooseCand(id);else if(a==='nextRound')nextRound();else if(a==='restart'){let s=state(4);s.placed=[];s.sel=null;s.fb='';render()}else if(a==='verifyPick'){e.stopPropagation();let s=state(4);if(s.done)return;s.chosen=b.checked?[...new Set([...s.chosen,id])]:s.chosen.filter(x=>x!==id);render()}else if(a==='verify')verify();else if(a==='unplaceSpatial'){let selected=S25.screen===1?state(1).rounds[state(1).round].sel:state(4).sel;if(selected){placeFromPoint(b.closest('.spatialTarget'),selected,e.clientX,e.clientY);return}if(S25.screen===1){let r=state(1).rounds[state(1).round];if(!r.done){r.placed=r.placed.filter(x=>x.id!==id);render()}}else if(S25.screen===4){let s=state(4);s.placed=s.placed.filter(x=>x.id!==id);render()}}});
let drag=null;document.addEventListener('pointerdown',e=>{let p=e.target.closest('.piece[data-id]');if(!p)return;drag={id:p.dataset.id,x:e.clientX,y:e.clientY,g:null,source:p};p.setPointerCapture?.(e.pointerId)});document.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.g&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>=8){drag.g=drag.source.cloneNode(true);drag.g.classList.add('ghost25');document.body.appendChild(drag.g)}if(drag.g){drag.g.style.left=e.clientX+'px';drag.g.style.top=(e.clientY-24)+'px'}});document.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;if(d.g){d.g.remove();suppressPieceClickUntil=Date.now()+350;let z=document.elementFromPoint(e.clientX,e.clientY),target=z?.closest('.spatialTarget');if(target)placeFromPoint(target,d.id,e.clientX,e.clientY)}});document.addEventListener('pointercancel',()=>{if(drag?.g)drag.g.remove();drag=null});
window.getEvidence=()=>clone(S25.evidence);S25=fresh();render();
