ch-action:none;z-index:2;display:flex;align-items:center;justify-content:center;color:#4a3429;font:700 14px "Times New Roman",serif;padding:0}.pencil:after{content:'';position:absolute;right:-14px;top:-2px;width:14px;height:44px;background:#e3bc8c;clip-path:polygon(0 0,100% 50%,0 100%)}.pencil.focused{outline:3px solid #d79c25}.starttarget{z-index:3;width:44px;position:absolute;left:calc(9% - 20px);height:100%;background:#d7eee266;border:0;border-radius:10px;touch-action:none}.align-label{display:flex;justify-content:center;gap:10px;font:700 14px "Times New Roman",serif}.balance{width:min(340px,80vw);height:175px;position:relative}.beam{position:absolute;top:55px;left:7%;width:86%;height:8px;background:#548f86;transform:rotate(11deg)}.stand{position:absolute;left:47%;top:62px;width:6%;height:104px;background:#659c8b;clip-path:polygon(50% 0,100% 100%,0 100%)}.pan{position:absolute;width:90px;height:60px;border-bottom:7px solid #a97338;border-radius:0 0 40px 40px;text-align:center}.pan.left{left:0;top:12px}.pan.right{right:0;top:70px}.ball{width:65px;height:65px;border-radius:50%;background:#f4ad4a;border:4px solid #ac7842;margin:auto;background-image:linear-gradient(90deg,transparent 47%,#ac7842 48%,#ac7842 52%,transparent 53%)}.sand{width:44px;height:44px;background:#ac7d4b;border:3px solid #725232;border-radius:12px 12px 20px 20px;margin:auto}.shape-work{display:flex;align-items:center;gap:28px;justify-content:center;width:100%}.target{width:clamp(140px,25vw,210px);height:clamp(140px,25vw,210px);position:relative;border:3px solid #416c67;background:white}.slot{position:absolute;inset:0;border:0;padding:0;background:#edf3f1;touch-action:none}.slot[data-slot="a"]{clip-path:polygon(0 0,100% 0,0 100%)}.slot[data-slot="b"]{clip-path:polygon(100% 0,100% 100%,0 100%)}.slot.filled{background:#efb457}.slot.filled[data-slot="b"]{background:#78b9cc}.diagonal{position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,transparent 49.5%,#668d86 49.5%,#668d86 50.5%,transparent 50.5%)}.piece{width:65px;height:65px;padding:0;background:transparent;border:0;touch-action:none;position:relative;min-width:65px;min-height:65px}.piece:before{content:'';position:absolute;inset:6px;background:#efb457;clip-path:polygon(0 0,100% 0,0 100%)}.piece[data-piece="b"]:before{background:#78b9cc;clip-path:polygon(100% 0,100% 100%,0 100%)}.piece[data-piece="c"]:before{background:#bc93d0;border-radius:50%;clip-path:none}.piece.selected{outline:3px solid #d39824;border-radius:9px}.piece.used{opacity:.35}.dragghost{position:fixed;pointer-events:none;z-index:100;opacity:.8;margin-left:-30px;margin-top:-30px}.pattern{display:flex;align-items:center;gap:10px;font:bold clamp(26px,5vw,44px) "Times New Roman",serif}.pattern-unit{display:flex;gap:8px;padding:4px 8px;background:#fff0b5;border-radius:12px}.hero{height:clamp(130px,28vh,240px);width:auto;object-fit:contain}.story{display:flex;gap:20px;align-items:center;justify-content:center;max-width:100%}.path{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px;border:3px solid #d5ad77;border-radius:25px;background:#f7edcf}.badge{min-width:56px;min-height:54px;border:2px solid #6ba99f;background:#fff4c9;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 25px "Times New Roman",serif;color:var(--ink)}.badge.selected{outline:3px solid #d49423}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.endtext{font-size:clamp(16px,2.5vw,22px);text-align:center;line-height:1.4;max-width:700px}.school{font-size:80px;text-align:center}.breathe{font:14px "Times New Roman",serif;text-align:center;color:#496f68}.listen{border:0;background:transparent;color:var(--teal);font-size:19px;min-width:32px;min-height:32px}.cue{background:#fff3ba;border-radius:10px}.cue .object:first-child{outline:3px solid #d8a327;border-radius:8px}@keyframes arrive{from{translate:0 -12px;opacity:.5}to{translate:0 0;opacity:1}}@keyframes leave{from{translate:0 0;opacity:1}to{transla <script>

const BIBO='assets/bibo.png',LOGO='assets/logo.webp';

const levels=['Independent','Light','Guided','Not yet'];
const tasks=[
 {id:'count',station:1,answer:8,q:['How many leaves are there?','Có bao nhiêu chiếc lá?'],options:[7,8,9],h:[['Look carefully at every leaf.','Quan sát từng chiếc lá nhé.'],['Count each leaf once, row by row.','Đếm mỗi lá một lần, theo từng hàng.'],['Begin with one leaf. Then count the others yourself.','Bắt đầu với một chiếc lá. Con tự đếm các lá còn lại nhé.']]},
 {id:'compare',station:1,answer:'right',q:['Which group has more stars?','Nhóm nào có nhiều ngôi sao hơn?'],h:[['Look at both groups.','Quan sát cả hai nhóm nhé.'],['Match one star from each group in your mind.','Thử ghép mỗi ngôi sao bên này với một ngôi sao bên kia.'],['Start with one pair. Then compare the rest yourself.','Bắt đầu với một cặp. Con tự so sánh phần còn lại nhé.']]},
 {id:'part',station:2,answer:4,q:['There are 10 altogether. Which part is missing?','Có tất cả 10. Phần còn thiếu là nhóm nào?'],options:[3,4,5],h:[['Look at the whole and the known part.','Quan sát tổng và phần đã biết nhé.'],['The two parts together must make 10.','Hai phần gộp lại phải tạo thành 10.'],['Begin counting from the six dots. Continue with each dot in a choice.','Bắt đầu từ sáu chấm. Đếm tiếp từng chấm trong nhóm con chọn.']]},
 {id:'add',station:3,answer:8,q:['There are 5 balls. 3 more will join. How many will there be?','Có 5 quả bóng. Sẽ thêm 3 quả. Khi đó có bao nhiêu quả?'],options:[7,8,9],h:[['Look at the starting group and the new balls.','Quan sát nhóm ban đầu và số bóng thêm vào nhé.'],['Keep the starting group. Count on for the new balls.','Giữ số ban đầu. Đếm tiếp số bóng thêm vào.'],['Start at five. Count the first new ball, then finish yourself.','Bắt đầu từ năm. Đếm quả bóng mới thứ nhất, rồi con tự đếm tiếp.']]},
 {id:'subtract',station:3,answer:6,q:['There are 9 fish. 3 will swim away. How many will stay?','Có 9 con cá. 3 con sẽ bơi đi. Còn lại bao nhiêu con?'],options:[5,6,7],h:[['Look at the fish that will swim away.','Quan sát số cá sẽ bơi đi nhé.'],['Think about the starting group with three fish removed.','Hình dung nhóm ban đầu khi bớt đi ba con cá.'],['Mark one fish to leave in your mind. Continue removing and counting yourself.','Thử đánh dấu một con cá sẽ đi. Con tự bớt tiếp và đếm nhé.']]},
 {id:'relation',station:4,answer:'>',q:['Choose the sign that fits.','Chọn dấu phù hợp nhé.'],options:['>','<','='],h:[['Look at both numbers.','Quan sát hai số nhé.'],['Is the number on the left more, less, or the same?','Số bên trái lớn hơn, nhỏ hơn hay bằng số bên phải?'],['The open side of a comparison sign faces the greater number. Choose the sign yourself.','Phía mở rộng của dấu so sánh quay về số lớn hơn. Con tự chọn dấu nhé.']]},
 {id:'line',station:4,answer:7,q:['Bibo starts at 4. Move forward 3 steps. Where will he stop?','Bibo bắt đầu ở 4. Tiến 3 bước. Bạn ấy dừng ở số nào?'],options:[6,7,8],h:[['Find the start and the direction.','Tìm điểm bắt đầu và hướng đi nhé.'],['A step goes to the next number. The start is not step one.','Một bước đi tới số tiếp theo. Điểm bắt đầu không phải bước một.'],['The first step goes from 4 to 5. Finish the remaining steps yourself.','Bước đầu đi từ 4 tới 5. Con tự tìm các bước còn lại nhé.']]},
 {id:'fair',station:5,answer:'no',q:['Can we compare them fairly yet?','Bây giờ đã so sánh chính xác được chưa?'],options:['yes','no'],h:[['Look at the ends where the pencils start.','Quan sát đầu bắt đầu của hai bút nhé.'],['To compare length fairly, both starts need the same line.','Để so sánh độ dài chính xác, hai đầu bắt đầu cần cùng vạch.'],['Trace each pencil back to its start with your finger. Then decide yourself.','Dùng ngón tay dò về đầu bắt đầu của mỗi bút. Rồi con tự quyết định nhé.']]},
 {id:'align',station:5,answer:'red',q:['Drag both pencils to the start line. Then choose the longer one.','Kéo hai bút về cùng vạch bắt đầu. Rồi chọn bút dài hơn.'],h:[['Look at the start line.','Quan sát vạch bắt đầu nhé.'],['Put the flat start of each pencil on the line.','Đặt đầu phẳng của mỗi bút vào vạch.'],['Move one pencil to the line first. Then finish and compare yourself.','Đưa một bút tới vạch trước. Rồi con tự làm tiếp và so sánh nhé.']]},
 {id:'heavy',station:5,answer:'sand',q:['Which is heavier?','Vật nào nặng hơn?'],h:[['Look at the two pans of the scale.','Quan sát hai đĩa cân nhé.'],['The lower pan holds the heavier object.','Đĩa cân thấp hơn có vật nặng hơn.'],['Follow the beam to each pan. Find the lower pan yourself.','Dò theo đòn cân tới mỗi đĩa. Con tự tìm đĩa thấp hơn nhé.']]},
 {id:'shape',station:6,answer:'ab',q:['Use two pieces to fill the square.','Dùng hai mảnh ghép kín hình vuông nhé.'],h:[['Look at the edges of the pieces and the square.','Quan sát cạnh của các mảnh và hình vuông nhé.'],['Each half of the square needs a piece with matching straight edges.','Mỗi nửa hình vuông cần mảnh có cạnh thẳng vừa khít.'],['Choose one piece and try it in a half. Then finish the square yourself.','Chọn một mảnh và thử đặt vào một nửa. Rồi con tự ghép tiếp nhé.']]},
 {id:'pattern',station:6,answer:'circle',q:['What comes next?','Hình nào tiếp theo?'],options:['star','circle','triangle'],h:[['Look carefully from left to right.','Quan sát từ trái sang phải nhé.'],['Notice how the shapes take turns.','Quan sát cách các hình thay phiên nhau.'],['Start at the first shape. Say each shape in turn, then finish yourself.','Bắt đầu từ hình đầu tiên. Đọc lần lượt từng hình, rồi con tự tìm hình tiếp theo nhé.']]}
];
const symbols={star:'★',circle:'●',triangle:'▲'},badgeIcons=['🍃','●','🐟','↗','⚖','★'];
const ui={ready:["I'm Ready",'Con sẵn sàng'],check:['Check','Kiểm tra'],next:['Continue','Tiếp tục'],back:['Back','Quay lại'],again:['Play Again','Chơi lại'],hint:['Help','Gợi ý'],retry:['Try again.','Con thử lại nhé.'],great:['Well done!','Con làm tốt lắm!'],pick:['Choose or place something first.','Con chọn hoặc đặt mảnh trước nhé.'],title:['Ready for Grade 1 Challenge','Thử thách hành trang vào lớp 1'],story:["Today is our big challenge! Let's visit each station and use what we have learned.",'Hôm nay là thử thách lớn của chúng mình! Hãy cùng Bibo đi qua từng trạm và vận dụng những điều đã học nhé!'],end:['Wonderful! You used numbers, shapes, measuring, and patterns to complete the journey.','Tuyệt lắm! Con đã dùng số, hình, đo lường và quy luật để hoàn thành hành trình.'],reflect:['Which station would you like to try again?','Con muốn thử lại trạm nào?'],practice:['With a parent or teacher, try a station again using real objects.','Cùng bố mẹ hoặc cô giáo, con thử lại một trạm bằng đồ vật thật nhé.'],rest:['You can rest here before continuing.','Con có thể nghỉ ở đây trước khi tiếp tục.'],place:['Choose a piece, then tap a half. You can also drag it. Tap a used piece to remove it.','Chọn mảnh rồi chạm vào một nửa hình. Con cũng có thể kéo thả. Chạm mảnh đã dùng để bỏ ra.'],aligned:['Both starts are on the line.','Hai đầu bắt đầu đã cùng vạch.'],alignfirst:['Bring both starts to the line before comparing.','Đưa hai đầu bắt đầu về cùng vạch rồi so sánh nhé.'],drop:['That piece does not fit here. Try another place or piece.','Mảnh này chưa vừa ở đây. Con thử chỗ hoặc mảnh khác nhé.'],verify:['Watch to check your prediction.','Quan sát để kiểm chứng dự đoán nhé.'],yes:['Yes','Có'],no:['No','Chưa'],red:['Red pencil','Bút đỏ'],blue:['Blue pencil','Bút xanh'],ball:['Ball','Bóng'],sand:['Sandbag','Túi cát']};
