let S;
function t(k){return C[S.lang][k]}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeModels(){return shuffle([3,4,6,7,8]).slice(0,3).map(a=>{let wrong=shuffle([1,2,3,4,5,6,7,8,9].filter(n=>n!==a)).slice(0,2);return{a,b:10-a,options:shuffle([a,...wrong])}})}
function makeMissing(){let given=shuffle([3,4,6,7,8]).slice(0,2);given.splice(Math.floor(Math.random()*3),0,5);return given.map(g=>{let answer=10-g,others=shuffle([1,2,3,4,5,6,7,8,9].filter(n=>n!==answer)).slice(0,2);return{given:g,answer,missingLeft:Math.random()<.5,options:shuffle([answer,...others])}})}
function fresh(){return{lang:'en',audio:true,screen:0,phase:'start',feedback:'',selected:null,boxes:[0,0],models:makeModels(),modelRound:0,modelChoice:null,bondPairs:[[5,5],shuffle([[2,8],[3,7],[4,6]])[0]],bondRound:0,bondCount:[0,0],missing:makeMissing(),round:0,choice:null}}
function speechKey(){return [S.screen,S.phase,S.round,S.boxes.join(','),S.modelRound,S.modelChoice,S.bondRound,S.bondCount.join(','),S.choice,S.selected].join(':')}
const Audio = {
  queue: [],
  mode: 'tts', activeSpeechId: null, activeUtterance: null, selectedVoice: null,
  voices: [], voicesReady: false, pendingSpeech: null, pendingTimer: null, generation: 0,
  notice: '', rate: { vi: .84, en: .88 }, pitch: 1.06, volume: 1,
  status(message = '') {
    this.notice = message;
    const bar = document.querySelector('.head');
    if (!bar) return;
    let label = bar.querySelector('#audio-status');
    if (!label && message) {
      label = document.createElement('span'); label.id = 'audio-status';
      label.className = 'audio-status'; label.setAttribute('role', 'status');
      bar.append(label);
    }
    if (label) { label.textContent = message; label.hidden = !message; }
  },
  stop() {
    this.queue = [];
    this.generation += 1; clearTimeout(this.pendingTimer); this.pendingTimer = null;
    this.pendingSpeech = null; this.activeSpeechId = null;
    if (this.activeUtterance) { this.activeUtterance.onstart = null; this.activeUtterance.onend = null; this.activeUtterance.onerror = null; }
    this.activeUtterance = null;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    this.status();
  },
  loadVoices() {
    this.voices = 'speechSynthesis' in window ? window.speechSynthesis.getVoices() : [];
    this.voicesReady = this.voices.length > 0;
    return this.voices;
  },
  voice(language = 'en') {
    if (language !== 'en' || S.lang !== 'en') return null;
    const matching = this.loadVoices().filter(v => v.lang.toLowerCase().replace(/_/g, '-') === 'en-us');
    // Named voices only. Apple candidates still require audible device review.
    const voice = matching.find(v => /^Microsoft Zira(?: Desktop)? - English \(United States\)$/i.test(v.name))
      || matching.find(v => v.name === 'Tiếng Anh Hoa Kỳ' && v.voiceURI === 'Tiếng Anh Hoa Kỳ' && v.localService === true)
      || matching.find(v => /^Samantha(?: \((?:Enhanced|Premium|English \(United States\))\))?$/i.test(v.name))
      || matching.find(v => /^Ava(?: \((?:Enhanced|Premium|English \(United States\))\))?$/i.test(v.name))
      || null;
    this.selectedVoice = voice;
    return voice;
  },
  current(request) {
    return request.generation === this.generation && request.screen === speechKey()
      && request.session === S && S.lang === 'en' && S.audio;
  },
  drain() {
    while (this.queue.length && !this.activeUtterance) {
      const next = this.queue.shift();
      if (this.current(next.request)) this.dispatch(next.request, next.voice);
    }
  },
  dispatch(request, voice) {
    if (!this.current(request)) return;
    // Let the current word finish; navigation and Audio off still call stop().
    if (this.activeUtterance) { this.queue.push({ request, voice }); return; }
    // Consume before speak, so later voiceschanged events cannot replay this request.
    this.pendingSpeech = null; clearTimeout(this.pendingTimer); this.pendingTimer = null;
    const utterance = new SpeechSynthesisUtterance(request.text);
    utterance.lang = 'en-US'; utterance.voice = voice;
    utterance.rate = this.rate.en; utterance.pitch = this.pitch; utterance.volume = this.volume;
    this.activeSpeechId = request.speechId; this.activeUtterance = utterance; this.status();
    utterance.onstart = () => { if (this.current(request)) this.status(); };
    utterance.onend = () => { if (this.activeUtterance === utterance) { this.activeSpeechId = null; this.activeUtterance = null; this.drain(); } };
    utterance.onerror = () => {
      if (!this.current(request) || this.activeUtterance !== utterance) return;
      this.activeSpeechId = null; this.activeUtterance = null;
      this.status('Audio could not play. Turn Audio off, then on to retry.');
      this.queue = [];
    };
    try {
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      window.speechSynthesis.speak(utterance);
    } catch { utterance.onerror(); }
  },
  request(speechId, value) {
    if (S.lang !== 'en' || !S.audio || this.mode !== 'tts') return;
    if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
      this.status('English audio is unavailable on this browser.'); return;
    }
    const text = typeof value === 'string' ? value : ''; 
    if (!text) return;
    const request = { speechId, text, generation: this.generation, screen: speechKey(), session: S };
    const voice = this.voice('en');
    if (voice) { this.dispatch(request, voice); return; }
    this.pendingSpeech = request;
    this.status('Loading a female US English voice…');
    this.pendingTimer = setTimeout(() => {
      if (this.pendingSpeech !== request || !this.current(request)) return;
      this.pendingSpeech = null; this.pendingTimer = null;
      this.status('No supported female US English voice. Try Audio off/on.');
    }, 2500);
  },
  play(speechId, value) {
    this.request(speechId, value);
  },
  playEnglish(speechId, value) { this.request(speechId, value); },
  voicesChanged() {
    this.loadVoices();
    const request = this.pendingSpeech;
    if (!request) return;
    if (!this.current(request)) { this.pendingSpeech = null; clearTimeout(this.pendingTimer); this.pendingTimer = null; return; }
    const voice = this.voice('en');
    if (voice) this.dispatch(request, voice);
  }
};
if ('speechSynthesis' in window) window.speechSynthesis.addEventListener('voiceschanged', () => Audio.voicesChanged());
window.addEventListener('pagehide', () => Audio.stop());



function speak(text){Audio.play('lesson',text)}
function scheduleSpeech(text,delay,screen=S.screen){const generation=Audio.generation,key=speechKey();setTimeout(()=>{if(generation===Audio.generation&&screen===S.screen&&key===speechKey())speak(text)},delay)}

function cookieButton(where,i){return`<button class="cookie ${S.selected===where?'selected':''}" draggable="true" ondragstart="dragCookie(event,'${where}')" onclick="event.stopPropagation();cookieTap('${where}',${i})" aria-label="cookie">🍪</button>`}
function sourceCookies(){let left=10-S.boxes[0]-S.boxes[1];return`<div class="cookieSource" ondragover="event.preventDefault()" ondrop="dropSource(event)">${Array.from({length:left},(_,i)=>cookieButton('source',i)).join('')}</div>`}
function tray(i){return`<div class="tray" role="button" tabindex="0" aria-label="tray ${i+1}" onclick="trayTap(${i})" ondragover="event.preventDefault()" ondrop="dropTray(event,${i})">${Array.from({length:S.boxes[i]},(_,k)=>cookieButton('tray'+i,k)).join('')}${S.phase==='correct'?`<span class="trayCount">${S.boxes[i]}</span>`:''}</div>`}
function s2(){let complete=S.boxes[0]+S.boxes[1]===10,acts=S.phase==='correct'?`<button class="btn primary" onclick="go(2)">${t('next')}</button>`:`<button class="btn check" ${complete?'':'disabled'} onclick="checkSplit()">${t('check')}</button>`;return frame(`${t('divide')}<small class="hint">${t('tap')}</small>`,`<div class="work">${S.phase==='correct'?'<div class="splitTotal total10">10</div>':sourceCookies()}<div class="trayGrid">${tray(0)}${tray(1)}</div></div>`,acts)}
function frameDots(a){return`<div class="tenFrame">${Array.from({length:10},(_,i)=>`<span class="cell"><i class="dot ${i>=a?'blue':''}"></i></span>`).join('')}</div>`}
function modelPrompt(r){return t('model').replace('{a}',r.a).replace('{b}',r.b)}
function s3(){let r=S.models[S.modelRound],done=S.phase==='correct',acts=done?`<button class="btn primary" onclick="nextModel()">${t('next')}</button>`:`<button class="btn check" onclick="checkModel()">${t('check')}</button>`;return frame(done?modelConclusion(r):modelPrompt(r),`<div class="modelChoices">${r.options.map(a=>`<button class="modelCard ${S.modelChoice===a?'sel':''}" onclick="S.modelChoice=${a};S.feedback='';render()">${frameDots(a)}</button>`).join('')}</div>`,acts)}
function bondView(parts){return`<div class="bond10"><div class="total10">10</div><div class="branch10"></div><div class="parts10">${parts.map((n,i)=>`<div class="part10">${Array.from({length:n},(_,k)=>`<button class="dotBtn ${k<S.bondCount[i]?'counted':''}" onclick="countPart(${i},${k})"><i class="dot ${i?'blue':''}"></i></button>`).join('')}${S.bondCount[i]===n?`<span class="partNum">${n}</span>`:''}</div>`).join('')}</div></div>`}
function s4(){let parts=S.bondPairs[S.bondRound],done=S.bondCount[0]===parts[0]&&S.bondCount[1]===parts[1],acts=S.phase==='done'?`<button class="btn primary" onclick="go(4)">${t('next')}</button>`:done?`<button class="btn check" onclick="nextBond()">${S.bondRound===0?t('next'):t('check')}</button>`:'';return frame(S.bondRound===0?t('bond'):t('bondNext'),bondView(parts),acts)}
function splitConclusion(r){let left=r.missingLeft?r.answer:r.given,right=r.missingLeft?r.given:r.answer;return S.lang==='vi'?`${left} và ${right} tạo thành 10.`:`${left} and ${right} make ten.`}
function s5(){let r=S.missing[S.round],shown=S.phase==='correct',left=r.missingLeft?(shown?r.answer:'?'):r.given,right=r.missingLeft?r.given:(shown?r.answer:'?'),acts=shown?`<button class="btn primary" onclick="nextMissing()">${t('next')}</button>`:`<div class="numChoices">${r.options.map(n=>`<button class="numChoice ${S.choice===n?'sel':''}" onclick="S.choice=${n};S.feedback='';render()">${n}</button>`).join('')}</div><button class="btn check" onclick="checkMissing()">${t('check')}</button>`;return frame(shown?splitConclusion(r):t('missing'),`<div class="numBond"><div class="total10">10</div><div class="branch10"></div><div class="numParts"><div class="numPart">${left}</div><div class="numPart">${right}</div></div></div>`,acts)}
function s6(){return frame(t('thanks'),`<div class="finish"><img src="${A.bibo}" alt="Bibo"><div>${t('real')}<br><br><b>${t('bye')}</b></div></div>`,`<button class="btn primary" onclick="Audio.stop();S=fresh();render();scheduleSpeech(t('story'),250,0)">${t('again')}</button>`)}
function cookieTap(where){if(where==='source'){S.selected=S.selected==='source'?null:'source'}else{let from=Number(where.slice(-1));if(S.selected==='source'){if(S.boxes[0]+S.boxes[1]<10)S.boxes[from]++;S.selected=null}else{S.selected=where}}S.feedback='';render()}
function trayTap(i){if(S.selected==='source'){if(S.boxes[0]+S.boxes[1]<10){S.boxes[i]++;speak(String(S.boxes[i]))}S.selected=null}else if(S.selected&&S.selected.startsWith('tray')){let from=Number(S.selected.slice(-1));if(from!==i&&S.boxes[from]>0){S.boxes[from]--;S.boxes[i]++}S.selected=null}S.feedback='';render()}
function dragCookie(e,where){e.stopPropagation();e.dataTransfer.setData('text/plain',where)}
function dropTray(e,i){e.preventDefault();let x=e.dataTransfer.getData('text/plain');if(x==='source'&&S.boxes[0]+S.boxes[1]<10)S.boxes[i]++;else if(x.startsWith('tray')){let from=Number(x.slice(-1));if(from!==i&&S.boxes[from]>0){S.boxes[from]--;S.boxes[i]++}}S.selected=null;render()}
function dropSource(e){e.preventDefault();let x=e.dataTransfer.getData('text/plain');if(x.startsWith('tray')){let from=Number(x.slice(-1));if(S.boxes[from]>0)S.boxes[from]--}S.selected=null;render()}
function checkSplit(){let a=S.boxes[0],b=S.boxes[1];if(a+b!==10){S.feedback=t('try');speak(t('try'))}else if(!a||!b){S.feedback=t('both');speak(t('both'))}else{S.phase='correct';S.feedback=t('correct');speak(`${t('correct')} ${a} and ${b} make ten.`)}render()}
function modelConclusion(r){return S.lang==='vi'?`${r.a} và ${r.b} tạo thành 10.`:`${r.a} and ${r.b} make ten.`}
function checkModel(){let r=S.models[S.modelRound];if(S.modelChoice===r.a){S.phase='correct';S.feedback=t('correct');speak(`${t('correct')} ${modelConclusion(r)}`)}else{S.feedback=t('try');speak(t('try'))}render()}
function nextModel(){if(S.modelRound===S.models.length-1){go(3);return}S.modelRound++;S.modelChoice=null;S.phase='start';S.feedback='';render();speak(modelPrompt(S.models[S.modelRound]))}
function countPart(i,k){let parts=S.bondPairs[S.bondRound];if(k!==S.bondCount[i]||S.bondCount[i]>=parts[i])return;S.bondCount[i]++;speak(String(S.bondCount[i]),false);render()}
function nextBond(){if(S.bondRound===0){S.bondRound=1;S.bondCount=[0,0];S.feedback='';speak(t('bondNext'))}else{S.phase='done';S.feedback=t('correct');speak(t('correct'))}render()}
function checkMissing(){let r=S.missing[S.round];if(S.choice===r.answer){S.phase='correct';S.feedback=t('correct');speak(`${t('correct')} ${splitConclusion(r)}`)}else{S.feedback=t('try');speak(t('try'))}render()}
function nextMissing(){if(S.round===S.missing.length-1){go(5);return}S.round++;S.choice=null;S.phase='start';S.feedback='';render();speak(t('missing'))}
function go(n){Audio.stop();S.screen=n;S.phase='start';S.feedback='';S.selected=null;if(n===1)S.boxes=[0,0];if(n===2){S.modelRound=0;S.modelChoice=null}if(n===3){S.bondRound=0;S.bondCount=[0,0]}if(n===4){S.round=0;S.choice=null}render();let prompts=[t('story'),t('divide'),modelPrompt(S.models[0]),t('bond'),t('missing'),t('thanks')];scheduleSpeech(prompts[n],120,n)}
function back(){if(S.screen===0)return;go(S.screen-1)}
function setLanguage(lang){S.lang=lang;if(S.phase==='correct')S.feedback=t('correct');Audio.stop();render()}
function toggleAudio(){S.audio=!S.audio;if(!S.audio)Audio.stop();render()}
S=fresh();render();scheduleSpeech(t('story'),350,0);
</script></body></html>
